<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lanzarote - Distribución por Canal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .delta-track {
            height: 6px;
            background-color: #e5eeff;
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }
        .delta-fill {
            height: 100%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(203, 219, 245, 0.5);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface": "#f8f9ff",
                      "surface-tint": "#565e74",
                      "surface-dim": "#cbdbf5",
                      "surface-container": "#e5eeff",
                      "background": "#f8f9ff",
                      "on-tertiary": "#ffffff",
                      "surface-container-lowest": "#ffffff",
                      "primary-container": "#131b2e",
                      "error": "#ba1a1a",
                      "outline": "#76777d",
                      "tertiary-container": "#002113",
                      "secondary-fixed-dim": "#adc6ff",
                      "primary-fixed-dim": "#bec6e0",
                      "on-tertiary-container": "#009668",
                      "inverse-on-surface": "#eaf1ff",
                      "on-primary-container": "#7c839b",
                      "on-background": "#0b1c30",
                      "inverse-primary": "#bec6e0",
                      "surface-container-high": "#dce9ff",
                      "primary-fixed": "#dae2fd",
                      "on-surface": "#0b1c30",
                      "surface-container-low": "#eff4ff",
                      "tertiary": "#000000",
                      "on-tertiary-fixed": "#002113",
                      "tertiary-fixed": "#6ffbbe",
                      "on-primary-fixed-variant": "#3f465c",
                      "on-error": "#ffffff",
                      "surface-variant": "#d3e4fe",
                      "tertiary-fixed-dim": "#4edea3",
                      "primary": "#000000",
                      "error-container": "#ffdad6",
                      "on-secondary-fixed": "#001a42",
                      "on-secondary": "#ffffff",
                      "on-error-container": "#93000a",
                      "secondary-fixed": "#d8e2ff",
                      "on-primary": "#ffffff",
                      "inverse-surface": "#213145",
                      "secondary": "#0058be",
                      "outline-variant": "#c6c6cd",
                      "surface-container-highest": "#d3e4fe",
                      "on-secondary-container": "#fefcff",
                      "on-secondary-fixed-variant": "#004395",
                      "on-tertiary-fixed-variant": "#005236",
                      "secondary-container": "#2170e4",
                      "on-primary-fixed": "#131b2e",
                      "surface-bright": "#f8f9ff",
                      "on-surface-variant": "#45464d"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "gutter": "24px",
                      "card-padding": "20px",
                      "unit": "4px",
                      "margin-mobile": "16px",
                      "margin-desktop": "32px"
              },
              "fontFamily": {
                      "headline-md": ["Plus Jakarta Sans"],
                      "mono-data": ["JetBrains Mono"],
                      "label-caps": ["Inter"],
                      "body-lg": ["Inter"],
                      "body-sm": ["Inter"],
                      "headline-lg": ["Plus Jakarta Sans"],
                      "headline-lg-mobile": ["Plus Jakarta Sans"],
                      "display-kpi": ["Plus Jakarta Sans"]
              },
              "fontSize": {
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "mono-data": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                      "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "display-kpi": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
              }
            },
          },
        }
      </script>
</head>
<body class="bg-surface font-body-sm text-on-surface min-h-screen flex">
<aside class="w-[280px] h-screen sticky left-0 top-0 border-r border-outline-variant bg-surface flex flex-col py-gutter px-4 z-50" id="sidebar"></aside>
<main class="flex-1 flex flex-col min-w-0">
<header class="flex justify-between items-center h-16 px-gutter w-full sticky top-0 z-40 bg-surface-bright shadow-sm border-b border-outline-variant" id="topbar"></header>
<div class="p-gutter max-w-[1440px] mx-auto w-full space-y-8" id="distribution-root"></div>
</main>
<script src="state.js"></script>
<script>
        const distributionApi = window.LanzaroteState;
        const allocationQuantities = {};
        const strategyProfiles = {
            balanced: { meson: 0.4, retiro: 0.3, delivery: 0.3, label: "Balanced" },
            retail: { meson: 0.58, retiro: 0.24, delivery: 0.18, label: "Retail Push" },
            delivery: { meson: 0.2, retiro: 0.15, delivery: 0.65, label: "Delivery Rush" }
        };

        function getDisplayItems(channel, pendingItems, productMap) {
            const merged = new Map();

            channel.stock.forEach((item) => {
                merged.set(item.productoId, {
                    productoId: item.productoId,
                    cantidad: item.cantidad,
                    pending: 0,
                    nombre: productMap[item.productoId].nombre
                });
            });

            pendingItems.forEach((item) => {
                const current = merged.get(item.productoId) || {
                    productoId: item.productoId,
                    cantidad: 0,
                    pending: 0,
                    nombre: productMap[item.productoId].nombre
                };
                merged.set(item.productoId, {
                    ...current,
                    cantidad: current.cantidad + item.cantidad,
                    pending: current.pending + item.cantidad
                });
            });

            return [...merged.values()].sort((a, b) => b.cantidad - a.cantidad);
        }

        function renderDistribution() {
            const state = distributionApi.getState();
            const metrics = distributionApi.buildMetrics(state);
            const productMap = distributionApi.getProductMap(state);
            const pendingByProduct = state.asignacionesPendientes.reduce((accumulator, item) => {
                accumulator[item.productoId] = (accumulator[item.productoId] || 0) + item.cantidad;
                return accumulator;
            }, {});
            const pendingUnits = state.asignacionesPendientes.reduce((sum, item) => sum + item.cantidad, 0);
            const stockAvailable = state.stockTerminado.reduce((sum, item) => sum + item.cantidadDisponible, 0);
            const projectedRevenue = state.stockTerminado.reduce((sum, item) => {
                const product = productMap[item.productoId];
                return sum + item.cantidadDisponible * (product ? product.precioUnitario : 0);
            }, 0);

            distributionApi.mountShell({
                activePage: "distribution",
                title: "Distribution",
                header: {
                    eyebrow: "CONTROL DE DISTRIBUCIÓN",
                    badge: "Asignacion click-to-assign",
                    badgeIcon: "inventory_2",
                    secondaryActions: [
                        { id: "distribution-refresh", icon: "autorenew", label: "Refrescar" },
                        { id: "distribution-sales", icon: "payments", label: "Ventas" }
                    ],
                    primaryAction: { id: "distribution-finalize-top", icon: "task_alt", label: "Finalizar Asignación" }
                }
            });

            const root = document.getElementById("distribution-root");
            root.innerHTML = `
                <section class="flex flex-row items-end justify-between gap-6">
                    <div>
                        <h2 class="font-headline-lg text-headline-lg text-primary">Distribucion por Canal</h2>
                        <p class="font-body-lg text-on-surface-variant">Assign finished goods to active sales fronts.</p>
                    </div>
                    <div class="flex gap-4">
                        <div class="min-w-[200px] rounded-xl border border-outline-variant bg-white/80 px-6 py-4 shadow-sm backdrop-blur-sm">
                            <span class="font-label-caps text-label-caps uppercase tracking-widest text-on-surface-variant">Stock Total Disponible</span>
                            <div class="mt-1 flex items-baseline gap-2">
                                <span class="font-display-kpi text-[36px] leading-none text-primary">${stockAvailable.toLocaleString("es-CL")}</span>
                                <span class="font-mono-data text-on-surface-variant">units</span>
                            </div>
                        </div>
                        <div class="min-w-[220px] rounded-xl border border-outline-variant bg-white/80 px-6 py-4 shadow-sm backdrop-blur-sm">
                            <span class="font-label-caps text-label-caps uppercase tracking-widest text-secondary">Ingreso Proyectado</span>
                            <div class="mt-1 flex items-baseline gap-2">
                                <span class="font-display-kpi text-[36px] leading-none text-secondary">${distributionApi.formatCurrency(projectedRevenue)}</span>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="grid grid-cols-12 gap-6">
                    <div class="col-span-8 rounded-2xl border border-outline-variant bg-white p-6 shadow-sm">
                        <div class="flex items-center justify-between gap-4">
                            <div>
                                <p class="font-label-caps text-label-caps uppercase tracking-widest text-on-surface-variant">Demo strategies</p>
                                <h3 class="mt-2 font-headline-md text-headline-md text-primary">Lanza una estrategia de asignacion en un clic</h3>
                            </div>
                            <div class="flex gap-2">
                                <button class="rounded-xl bg-primary px-4 py-3 text-xs font-semibold uppercase tracking-widest text-white transition-colors hover:bg-primary-container strategy-button" data-strategy="balanced" type="button">Balanced</button>
                                <button class="rounded-xl bg-white px-4 py-3 text-xs font-semibold uppercase tracking-widest text-secondary shadow-sm transition-colors hover:bg-surface-container strategy-button" data-strategy="retail" type="button">Retail Push</button>
                                <button class="rounded-xl bg-white px-4 py-3 text-xs font-semibold uppercase tracking-widest text-primary shadow-sm transition-colors hover:bg-surface-container strategy-button" data-strategy="delivery" type="button">Delivery Rush</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-span-4 rounded-2xl border border-outline-variant bg-primary-container p-6 text-white shadow-sm">
                        <p class="font-label-caps text-label-caps uppercase tracking-widest text-primary-fixed-dim">Recommended talk track</p>
                        <p class="mt-3 text-sm text-white/90">Muestra como una decision de canal cambia la capacidad visible al instante y deja listo el stock para ventas.</p>
                    </div>
                </section>

                <div class="grid grid-cols-12 items-start gap-8">
                    <div class="col-span-3 space-y-4">
                        <div class="flex items-center justify-between px-2">
                            <h3 class="font-label-caps text-label-caps uppercase tracking-widest text-on-surface-variant">Inventario de Producto Terminado</h3>
                            <span class="material-symbols-outlined text-outline">unfold_more</span>
                        </div>
                        <div class="space-y-3">
                            ${state.stockTerminado.map((stock) => {
                                const product = productMap[stock.productoId];
                                const pending = pendingByProduct[stock.productoId] || 0;
                                const visibleAvailable = Math.max(0, stock.cantidadDisponible - pending);
                                const ratio = Math.min(1, visibleAvailable / Math.max(product.rendimientoEsperado, visibleAvailable, 1));
                                const barTone = ratio < 0.35 ? "bg-on-tertiary-container" : ratio < 0.7 ? "bg-secondary" : "bg-secondary-container";

                                return `
                                    <div class="rounded-xl border border-outline-variant bg-white p-4 shadow-sm">
                                        <div class="mb-2 flex items-start justify-between gap-3">
                                            <span class="font-headline-md text-headline-md text-primary">${product.nombre}</span>
                                            <span class="material-symbols-outlined text-outline-variant">drag_indicator</span>
                                        </div>
                                        <div class="flex items-end justify-between gap-4">
                                            <div>
                                                <p class="font-label-caps text-label-caps uppercase tracking-widest text-on-surface-variant">Disponible</p>
                                                <p class="font-mono-data text-[18px] text-primary">${visibleAvailable.toLocaleString("es-CL")} <span class="text-[12px] opacity-60">u.</span></p>
                                            </div>
                                            <div class="text-right">
                                                <p class="font-label-caps text-label-caps uppercase tracking-widest text-on-surface-variant">Valorización</p>
                                                <p class="font-mono-data text-secondary">${distributionApi.formatCurrency(product.precioUnitario)}/u</p>
                                            </div>
                                        </div>
                                        <div class="mt-3 h-1.5 w-full overflow-hidden rounded-full bg-surface-container">
                                            <div class="h-full ${barTone}" style="width:${Math.max(14, Math.round(ratio * 100))}%"></div>
                                        </div>
                                        <div class="mt-3 flex items-center justify-between text-[11px] font-semibold uppercase tracking-widest">
                                            <span class="text-on-surface-variant">Receta ${product.recetaId}</span>
                                            <span class="${pending > 0 ? "text-secondary" : "text-on-surface-variant"}">${pending > 0 ? `${pending} pendiente` : "Sin bloqueo"}</span>
                                        </div>
                                        <div class="mt-4 flex gap-2">
                                            <input class="w-24 rounded-lg border border-outline-variant bg-white px-3 py-2 font-mono-data text-mono-data text-primary quantity-input" data-product="${product.id}" min="0" placeholder="Cant." type="number" value="${allocationQuantities[product.id] || ""}"/>
                                            <button class="rounded-lg bg-primary px-3 py-2 text-xs font-semibold uppercase tracking-widest text-white transition-colors hover:bg-primary-container assign-button" data-channel="meson" data-product="${product.id}" type="button">Meson</button>
                                            <button class="rounded-lg bg-secondary px-3 py-2 text-xs font-semibold uppercase tracking-widest text-white transition-colors hover:bg-secondary-container assign-button" data-channel="retiro" data-product="${product.id}" type="button">Retiro</button>
                                            <button class="rounded-lg bg-tertiary-fixed px-3 py-2 text-xs font-semibold uppercase tracking-widest text-on-tertiary-fixed transition-opacity hover:opacity-90 assign-button" data-channel="delivery" data-product="${product.id}" type="button">Delivery</button>
                                        </div>
                                    </div>
                                `;
                            }).join("")}
                        </div>
                    </div>

                    <div class="col-span-9 grid grid-cols-3 gap-6">
                        ${state.canales.map((channel) => {
                            const pendingItems = state.asignacionesPendientes.filter((item) => item.canalId === channel.id);
                            const items = getDisplayItems(channel, pendingItems, productMap);
                            const badge = distributionApi.channelBadge(channel.id);
                            const toneClass = channel.id === "retiro" ? "bg-error" : channel.id === "delivery" ? "bg-secondary" : "bg-on-tertiary-container";
                            const icon = channel.id === "meson" ? "storefront" : channel.id === "retiro" ? "inventory_2" : "local_shipping";
                            const footerLabel = channel.id === "delivery" ? "Carga Logística" : "Capacidad";

                            return `
                                <div class="flex min-h-[600px] flex-col rounded-2xl border border-transparent bg-surface-container-low p-5 transition-all hover:border-secondary">
                                    <div class="mb-6 flex items-center justify-between">
                                        <div class="flex items-center gap-2">
                                            <span class="material-symbols-outlined text-secondary">${icon}</span>
                                            <h4 class="font-headline-md text-headline-md text-primary">${channel.nombre}</h4>
                                        </div>
                                        <span class="rounded px-2 py-0.5 text-[10px] font-bold uppercase ${badge.className}">${badge.label}</span>
                                    </div>
                                    <div class="flex-1 space-y-4">
                                        ${items.map((item) => `
                                            <div class="rounded-xl border border-outline-variant bg-white p-4 shadow-sm">
                                                <div class="mb-2 flex items-center justify-between">
                                                    <span class="font-body-sm font-bold text-primary">${item.nombre}</span>
                                                    <span class="font-mono-data text-secondary">${item.cantidad} u.</span>
                                                </div>
                                                <div class="flex items-center gap-2">
                                                    <span class="material-symbols-outlined text-[18px] text-on-surface-variant">remove</span>
                                                    <div class="h-1 flex-1 overflow-hidden rounded-full bg-surface-container">
                                                        <div class="h-full ${toneClass}" style="width:${Math.max(24, Math.min(100, Math.round((item.cantidad / Math.max(1, channel.capacidadBase)) * 200)))}%"></div>
                                                    </div>
                                                    <span class="material-symbols-outlined text-[18px] text-on-surface-variant">add</span>
                                                </div>
                                                ${item.pending > 0 ? `<p class="mt-2 text-[10px] font-bold uppercase tracking-widest text-secondary">${item.pending} por confirmar</p>` : ""}
                                            </div>
                                        `).join("")}
                                        <div class="flex h-24 items-center justify-center rounded-xl border-2 border-dashed border-outline-variant text-on-surface-variant opacity-50">
                                            <span class="material-symbols-outlined mr-2">add_circle</span>
                                            <span class="font-label-caps text-label-caps">Click to assign</span>
                                        </div>
                                    </div>
                                    <div class="mt-6 border-t border-outline-variant pt-4">
                                        <div class="mb-1 flex justify-between text-on-surface-variant">
                                            <span class="font-label-caps text-label-caps">${footerLabel}</span>
                                            <span class="font-mono-data text-[12px]">${channel.capacidadPct}%</span>
                                        </div>
                                        <div class="h-2 w-full overflow-hidden rounded-full bg-surface-container">
                                            <div class="h-full ${toneClass}" style="width:${channel.capacidadPct}%"></div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join("")}
                    </div>
                </div>

                <section class="grid grid-cols-4 gap-8 rounded-2xl border border-outline-variant bg-white/80 p-8 shadow-sm backdrop-blur-sm">
                    <div class="flex flex-col">
                        <span class="font-label-caps text-label-caps uppercase tracking-widest text-on-surface-variant">Stock Asignado</span>
                        <div class="mt-2 flex items-center gap-2">
                            <span class="font-display-kpi text-[32px] leading-none text-primary">${(metrics.assignedUnits + pendingUnits).toLocaleString("es-CL")}</span>
                            <span class="font-mono-data text-on-tertiary-container">+12% vs. esperado</span>
                        </div>
                    </div>
                    <div class="flex flex-col border-l border-outline-variant pl-8">
                        <span class="font-label-caps text-label-caps uppercase tracking-widest text-on-surface-variant">Stock Restante</span>
                        <div class="mt-2 flex items-center gap-2">
                            <span class="font-display-kpi text-[32px] leading-none text-on-surface-variant">${Math.max(0, metrics.availableUnits - pendingUnits).toLocaleString("es-CL")}</span>
                            <span class="font-mono-data text-outline">Sin Asignar</span>
                        </div>
                    </div>
                    <div class="flex flex-col border-l border-outline-variant pl-8">
                        <span class="font-label-caps text-label-caps uppercase tracking-widest text-on-surface-variant">Eficiencia de Canal</span>
                        <div class="mt-2 flex items-center gap-2">
                            <span class="font-display-kpi text-[32px] leading-none text-secondary">${metrics.conciliationPct.toFixed(1)}%</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-end">
                        <button class="flex items-center gap-2 rounded bg-primary px-8 py-4 font-bold uppercase tracking-widest text-white transition-all hover:bg-primary-container disabled:cursor-not-allowed disabled:bg-outline" ${state.asignacionesPendientes.length ? "" : "disabled"} id="distribution-finalize-bottom" type="button">
                            Finalizar Asignación
                            <span class="material-symbols-outlined">arrow_forward</span>
                        </button>
                        ${state.asignacionesPendientes.length ? `<p class="mt-3 text-[11px] font-semibold uppercase tracking-widest text-secondary">${state.asignacionesPendientes.length} movimientos por confirmar</p>` : ""}
                    </div>
                </section>
            `;

            document.getElementById("distribution-refresh").addEventListener("click", () => {
                renderDistribution();
                distributionApi.showToast("Distribucion recalculada con el stock actual.", "info");
            });
            document.getElementById("distribution-sales").addEventListener("click", () => {
                window.location.href = "sales.html";
            });
            document.querySelectorAll(".strategy-button").forEach((button) => {
                button.addEventListener("click", (event) => {
                    applyStrategy(event.target.dataset.strategy);
                });
            });
            document.getElementById("distribution-finalize-top").addEventListener("click", finalizeAllocation);
            document.getElementById("distribution-finalize-bottom").addEventListener("click", finalizeAllocation);

            document.querySelectorAll(".quantity-input").forEach((input) => {
                input.addEventListener("input", (event) => {
                    allocationQuantities[event.target.dataset.product] = event.target.value;
                });
            });

            document.querySelectorAll(".assign-button").forEach((button) => {
                button.addEventListener("click", (event) => {
                    const productId = event.target.dataset.product;
                    const canalId = event.target.dataset.channel;
                    const quantity = Number(allocationQuantities[productId] || 0);

                    if (!quantity) {
                        distributionApi.showToast("Ingresa una cantidad antes de asignar stock.", "warn");
                        return;
                    }

                    distributionApi.asignarACanal({
                        productoId: productId,
                        canalId,
                        cantidad: quantity
                    });
                    const channelLabel = state.canales.find((canal) => canal.id === canalId).nombre;
                    distributionApi.showToast(`${quantity} unidades asignadas a ${channelLabel}.`, "success");
                    allocationQuantities[productId] = "";
                    renderDistribution();
                });
            });
        }

        function finalizeAllocation() {
            const state = distributionApi.getState();
            if (!state.asignacionesPendientes.length) {
                distributionApi.showToast("No hay movimientos pendientes por confirmar.", "info");
                return;
            }
            distributionApi.finalizarAlocacion();
            distributionApi.showToast("Asignaciones finalizadas y stock enviado a canales.", "success");
            renderDistribution();
        }

        function applyStrategy(strategyName) {
            const profile = strategyProfiles[strategyName];
            if (!profile) {
                return;
            }

            const baseState = distributionApi.getState();
            distributionApi.setState({ ...baseState, asignacionesPendientes: [] });
            const state = distributionApi.getState();

            state.stockTerminado.forEach((stock) => {
                const available = stock.cantidadDisponible;
                if (!available) {
                    return;
                }

                const split = {
                    meson: Math.floor(available * profile.meson),
                    retiro: Math.floor(available * profile.retiro),
                    delivery: Math.floor(available * profile.delivery)
                };
                const assigned = split.meson + split.retiro + split.delivery;
                if (assigned < available) {
                    split.meson += available - assigned;
                }

                Object.entries(split).forEach(([canalId, cantidad]) => {
                    if (cantidad > 0) {
                        distributionApi.asignarACanal({ productoId: stock.productoId, canalId, cantidad });
                    }
                });
            });

            distributionApi.showToast(`Estrategia ${profile.label} cargada como propuesta de demo.`, "success");
            renderDistribution();
        }

        window.addEventListener("focus", renderDistribution);
        window.addEventListener("storage", renderDistribution);
        renderDistribution();
    </script>
</body></html>
