<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Panadator - Recetas</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-bright": "#f7f9fb",
            "on-tertiary": "#ffffff",
            "surface-container-highest": "#e0e3e5",
            "on-error": "#ffffff",
            "primary": "#000000",
            "on-tertiary-fixed-variant": "#38485d",
            "tertiary-container": "#0b1c30",
            "secondary-container": "#d5e3fd",
            "on-surface-variant": "#45464d",
            "secondary-fixed": "#d5e3fd",
            "surface-container": "#eceef0",
            "surface-variant": "#e0e3e5",
            "secondary": "#515f74",
            "tertiary-fixed-dim": "#b7c8e1",
            "surface-container-lowest": "#ffffff",
            "background": "#f7f9fb",
            "on-secondary-container": "#57657b",
            "on-secondary-fixed": "#0d1c2f",
            "on-secondary-fixed-variant": "#3a485c",
            "primary-fixed-dim": "#bec6e0",
            "outline": "#76777d",
            "inverse-surface": "#2d3133",
            "surface-dim": "#d8dadc",
            "error": "#ba1a1a",
            "on-error-container": "#93000a",
            "on-primary-fixed": "#131b2e",
            "surface": "#f7f9fb",
            "surface-container-low": "#f2f4f6",
            "on-surface": "#191c1e",
            "on-background": "#191c1e",
            "on-tertiary-fixed": "#0b1c30",
            "inverse-on-surface": "#eff1f3",
            "on-primary-container": "#7c839b",
            "error-container": "#ffdad6",
            "on-secondary": "#ffffff",
            "primary-fixed": "#dae2fd",
            "on-primary": "#ffffff",
            "on-primary-fixed-variant": "#3f465c",
            "tertiary": "#000000",
            "inverse-primary": "#bec6e0",
            "surface-container-high": "#e6e8ea",
            "surface-tint": "#565e74",
            "on-tertiary-container": "#75859d",
            "secondary-fixed-dim": "#b9c7e0",
            "tertiary-fixed": "#d3e4fe",
            "primary-container": "#131b2e",
            "outline-variant": "#c6c6cd"
          },
          borderRadius: {
            "sm": "0.125rem",
            "DEFAULT": "0.25rem",
            "md": "0.375rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          spacing: {
            "unit": "4px",
            "container-padding": "24px",
            "gutter": "16px",
            "stack-sm": "8px",
            "stack-md": "16px",
            "stack-lg": "32px"
          },
          fontFamily: {
            "display-lg": ["Plus Jakarta Sans", "sans-serif"],
            "headline-md": ["Plus Jakarta Sans", "sans-serif"],
            "label-caps": ["Plus Jakarta Sans", "sans-serif"],
            "body-md": ["Inter", "sans-serif"],
            "body-sm": ["Inter", "sans-serif"],
            "data-lg": ["JetBrains Mono", "monospace"],
            "data-md": ["JetBrains Mono", "monospace"]
          },
          fontSize: {
            "display-lg": ["36px", { lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "700" }],
            "headline-md": ["24px", { lineHeight: "1.3", fontWeight: "600" }],
            "label-caps": ["11px", { lineHeight: "16px", letterSpacing: "0.06em", fontWeight: "700" }],
            "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
            "body-sm": ["12px", { lineHeight: "18px", fontWeight: "400" }],
            "data-lg": ["20px", { lineHeight: "24px", fontWeight: "600" }],
            "data-md": ["14px", { lineHeight: "20px", fontWeight: "500" }]
          },
          boxShadow: {
            "soft": "0 8px 24px rgba(15, 23, 42, 0.08)"
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: "Inter", sans-serif; }
    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      vertical-align: middle;
    }
  </style>
</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_top_left,_rgba(255,222,173,0.3),_transparent_20%),radial-gradient(circle_at_top,_rgba(213,227,253,0.32),_transparent_28%),linear-gradient(180deg,_#fffaf2,_#f5efe4_58%,_#eef2f6)] text-on-surface antialiased md:flex">
  <aside class="px-3 pt-3 md:h-screen md:w-[300px] md:shrink-0 md:p-4 lg:w-[320px] lg:p-5 xl:w-[360px] xl:p-6" id="sidebar"></aside>
  <main class="min-w-0 flex-1">
    <header class="sticky top-0 z-30 border-b border-outline-variant/80 bg-[rgba(247,249,251,0.82)] px-4 py-4 backdrop-blur-xl sm:px-6 md:min-h-[88px] md:px-container-padding" id="topbar"></header>
    <div class="mx-auto w-full max-w-none space-y-stack-lg px-4 pb-6 pt-6 sm:px-6 md:p-container-padding md:pt-8" id="recetas-root"></div>
  </main>
  <script src="state.js?v=20260709-ui6"></script>
  <script>
    const recetasApi = window.LanzaroteState;

    function gramsPerUnit(recipeQtyKg, expectedYield) {
      return expectedYield > 0 ? Math.round((recipeQtyKg * 1000) / expectedYield) : 0;
    }

    function recipeStatus(product) {
      if (product.toleranciaPct <= 3) {
        return {
          label: "Precisa",
          chip: "bg-[#eef6ef] text-[#24704a]",
          bar: "bg-[#4fa875]",
        };
      }
      if (product.toleranciaPct <= 4) {
        return {
          label: "Flexible",
          chip: "bg-[#edf2ff] text-[#2f57d3]",
          bar: "bg-[#6b87ee]",
        };
      }
      return {
        label: "Sensitiva",
        chip: "bg-[#fff2df] text-[#b46b00]",
        bar: "bg-[#f1b33f]",
      };
    }

    function renderRecetas() {
      const state = recetasApi.getState();
      const ingredientMap = recetasApi.getIngredientMap(state);
      const totalRecipeRows = state.productos.reduce((sum, product) => sum + product.recetaInsumos.length, 0);
      const totalReferenceCost = state.productos.reduce((sum, product) => {
        const recipeCost = product.recetaInsumos.reduce((recipeSum, item) => {
          const ingredient = ingredientMap[item.insumoId];
          return recipeSum + (ingredient ? item.cantidad * ingredient.precioReferencia : 0);
        }, 0);
        return sum + (product.rendimientoEsperado > 0 ? recipeCost / product.rendimientoEsperado : 0);
      }, 0);
      const totalFormulaKg = state.productos.reduce((sum, product) =>
        sum + product.recetaInsumos.reduce((recipeSum, item) => recipeSum + item.cantidad, 0), 0);
      const averageTolerance = state.productos.length
        ? Math.round((state.productos.reduce((sum, product) => sum + (product.toleranciaPct || 0), 0) / state.productos.length) * 10) / 10
        : 0;

      recetasApi.mountShell({
        activePage: "recetas",
        title: "Recetas",
        header: {
          eyebrow: "PANADATOR · RECETAS",
          badge: `${state.productos.length} recetas activas`,
          badgeIcon: "menu_book",
          secondaryActions: [
            { id: "recetas-refresh", icon: "autorenew", label: "Refrescar" },
            { id: "recetas-inventory", icon: "inventory_2", label: "Inventarios" },
          ],
          primaryAction: { id: "recetas-production", icon: "bakery_dining", label: "Ver producción" },
        },
      });

      const root = document.getElementById("recetas-root");
      root.innerHTML = `
        <section class="grid gap-4 2xl:grid-cols-[minmax(0,1.2fr)_320px]">
          <article class="rounded-[32px] border border-[#ead7b2] bg-[radial-gradient(circle_at_top_left,_rgba(255,222,173,0.35),_transparent_22%),linear-gradient(180deg,_#fffdfa,_#fff5e6)] p-6 shadow-[0_18px_36px_rgba(140,96,31,0.1)] md:p-7">
            <div class="flex flex-wrap items-center gap-2">
              <span class="inline-flex items-center gap-2 rounded-full border border-[#ffd489] bg-[#fff5df] px-3 py-1 text-body-sm font-medium text-[#b46b00]">
                <span class="material-symbols-outlined text-[18px]">menu_book</span>
                Formulación maestra
              </span>
              <span class="rounded-full bg-white px-3 py-1 text-body-sm text-[#8f775c] shadow-soft">Panadator</span>
            </div>
            <h1 class="mt-4 max-w-4xl text-[34px] font-bold leading-[1.02] tracking-[-0.05em] text-primary md:text-[48px]">Recetas claras, costos visibles y consumo listo para producción.</h1>
            <div class="mt-6 grid gap-3 md:grid-cols-4">
              ${metricCard("widgets", "Productos", state.productos.length, "formulados", "soft")}
              ${metricCard("nutrition", "Insumos", totalRecipeRows, "relaciones activas", "warm")}
              ${metricCard("scale", "Carga base", `${totalFormulaKg.toFixed(1)} kg`, "en recetas", "default")}
              ${metricCard("tune", "Tolerancia", `${averageTolerance}%`, "promedio", "soft")}
            </div>
          </article>

          <aside class="rounded-[30px] bg-[linear-gradient(180deg,_#6d4627,_#4f311c)] p-5 text-white shadow-[0_20px_40px_rgba(79,49,28,0.22)]">
            <p class="text-label-caps text-[#dbc7b3]">Pulso de formulación</p>
            <div class="mt-4 space-y-3">
              <div class="rounded-2xl bg-white/10 p-4">
                <p class="text-label-caps text-[#dbc7b3]">Costo promedio</p>
                <p class="mt-2 font-data-md text-white">${recetasApi.formatCurrency(totalReferenceCost / Math.max(1, state.productos.length))}</p>
                <p class="mt-2 text-body-sm text-[#dbc7b3]">por unidad</p>
              </div>
              <div class="rounded-2xl bg-white/10 p-4">
                <div class="flex items-center justify-between gap-3">
                  <span class="text-body-sm text-[#dbc7b3]">Cobertura</span>
                  <span class="font-data-md text-white">${state.productos.length}/${state.productos.length}</span>
                </div>
                <div class="mt-3 h-2 overflow-hidden rounded-full bg-white/10">
                  <div class="h-full w-full bg-[#f1b33f]"></div>
                </div>
              </div>
              <div class="rounded-2xl bg-white/10 p-4">
                <p class="text-label-caps text-[#dbc7b3]">Lectura rápida</p>
                <div class="mt-3 grid grid-cols-3 gap-2 text-body-sm">
                  <span class="rounded-xl bg-white/10 px-3 py-2 text-center">Costo</span>
                  <span class="rounded-xl bg-white/10 px-3 py-2 text-center">Carga</span>
                  <span class="rounded-xl bg-white/10 px-3 py-2 text-center">Tolerancia</span>
                </div>
              </div>
            </div>
          </aside>
        </section>

        <section class="grid gap-4 2xl:grid-cols-2 min-[1900px]:grid-cols-3">
          ${state.productos.map((product) => {
            const recipeCost = product.recetaInsumos.reduce((sum, item) => {
              const ingredient = ingredientMap[item.insumoId];
              return sum + (ingredient ? item.cantidad * ingredient.precioReferencia : 0);
            }, 0);
            const totalKg = product.recetaInsumos.reduce((sum, item) => sum + item.cantidad, 0);
            const unitCost = product.rendimientoEsperado > 0 ? recipeCost / product.rendimientoEsperado : 0;
            const status = recipeStatus(product);

            return `
              <article class="rounded-[30px] border border-[#ead7b2] bg-[radial-gradient(circle_at_top_left,_rgba(255,222,173,0.16),_transparent_24%),linear-gradient(180deg,_#ffffff,_#fffaf2)] p-5 shadow-soft">
                <div class="flex items-start justify-between gap-4">
                  <div>
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="rounded-full bg-[#fff3dc] px-3 py-1 text-label-caps text-[#b46b00]">${product.recetaId}</span>
                      <span class="rounded-full px-3 py-1 text-body-sm font-semibold ${status.chip}">${status.label}</span>
                    </div>
                    <h2 class="mt-3 text-[24px] font-semibold tracking-[-0.04em] text-primary">${product.nombre}</h2>
                    <p class="mt-1.5 text-body-sm text-on-surface-variant">${product.equipo}</p>
                  </div>
                  <span class="rounded-2xl bg-[#eef2ff] px-3 py-2 text-body-sm font-semibold text-[#2341ae]">${product.rendimientoEsperado} ${product.unidad}</span>
                </div>

                <div class="mt-5 grid gap-3 sm:grid-cols-3">
                  <div class="rounded-2xl bg-white p-4 shadow-soft">
                    <p class="text-label-caps text-on-surface-variant">Costo unit.</p>
                    <p class="mt-2 font-data-md text-primary">${recetasApi.formatCurrency(unitCost)}</p>
                  </div>
                  <div class="rounded-2xl bg-white p-4 shadow-soft">
                    <p class="text-label-caps text-on-surface-variant">Carga lote</p>
                    <p class="mt-2 font-data-md text-primary">${totalKg.toFixed(1)} kg</p>
                  </div>
                  <div class="rounded-2xl bg-white p-4 shadow-soft">
                    <p class="text-label-caps text-on-surface-variant">Tolerancia</p>
                    <p class="mt-2 font-data-md text-primary">${product.toleranciaPct}%</p>
                  </div>
                </div>

                <div class="mt-5 rounded-[24px] border border-[#efe2c6] bg-[#fffdf8] p-4">
                  <div class="flex items-center justify-between gap-3">
                    <p class="text-label-caps text-[#8f775c]">Fórmula</p>
                    <span class="rounded-full bg-white px-3 py-1 text-body-sm text-on-surface-variant shadow-soft">${product.recetaInsumos.length} insumos</span>
                  </div>
                  <div class="mt-4 space-y-3">
                    ${product.recetaInsumos.map((item) => {
                      const ingredient = ingredientMap[item.insumoId];
                      const perUnitGrams = gramsPerUnit(item.cantidad, product.rendimientoEsperado);
                      const itemUnitCost = ingredient && product.rendimientoEsperado > 0
                        ? (item.cantidad * ingredient.precioReferencia) / product.rendimientoEsperado
                        : 0;
                      const recipeShare = totalKg > 0 ? Math.round((item.cantidad / totalKg) * 100) : 0;
                      return `
                        <article class="rounded-2xl border border-[#f1e7d2] bg-white p-4 shadow-soft">
                          <div class="flex items-start justify-between gap-3">
                            <div>
                              <p class="text-body-md font-semibold text-primary">${ingredient ? ingredient.nombre : item.insumoId}</p>
                              <p class="mt-1 text-body-sm text-on-surface-variant">${item.cantidad.toFixed(1)} ${ingredient ? ingredient.unidad : "kg"} por lote</p>
                            </div>
                            <span class="rounded-full bg-[#f7f8fb] px-3 py-1 font-data-md text-primary">${perUnitGrams} g/un</span>
                          </div>
                          <div class="mt-3 flex items-center justify-between text-body-sm">
                            <span class="text-on-surface-variant">Peso en mezcla</span>
                            <span class="font-data-md text-primary">${recipeShare}%</span>
                          </div>
                          <div class="mt-2 h-2 overflow-hidden rounded-full bg-[#f2e8d8]">
                            <div class="h-full ${status.bar}" style="width:${Math.max(8, recipeShare)}%"></div>
                          </div>
                          <div class="mt-3 flex items-center justify-between text-body-sm">
                            <span class="text-on-surface-variant">Costo por unidad</span>
                            <span class="font-data-md text-primary">${recetasApi.formatCurrency(itemUnitCost)}</span>
                          </div>
                        </article>
                      `;
                    }).join("")}
                  </div>
                </div>
              </article>
            `;
          }).join("")}
        </section>
      `;

      document.getElementById("recetas-refresh").addEventListener("click", renderRecetas);
      document.getElementById("recetas-inventory").addEventListener("click", () => {
        window.location.href = "insumos.html";
      });
      document.getElementById("recetas-production").addEventListener("click", () => {
        window.location.href = "production.html";
      });
    }

    function metricCard(icon, label, value, helper, tone) {
      const toneClass = tone === "warm"
        ? "border-[#f3ddba] bg-[#fff4df]"
        : tone === "soft"
          ? "border-[#dce4ff] bg-[#f7f9ff]"
          : "border-outline-variant bg-white";
      const iconClass = tone === "warm"
        ? "bg-[#fff1d5] text-[#b46b00]"
        : "bg-[#edf2ff] text-[#2f57d3]";
      return `
        <article class="rounded-[22px] border ${toneClass} px-4 py-3 shadow-soft">
          <div class="flex items-center gap-3">
            <span class="flex h-10 w-10 items-center justify-center rounded-2xl ${iconClass}">
              <span class="material-symbols-outlined text-[18px]">${icon}</span>
            </span>
            <div>
              <p class="text-label-caps text-on-surface-variant">${label}</p>
              <p class="mt-1 font-data-md text-primary">${value}</p>
            </div>
          </div>
          <p class="mt-2 text-body-sm text-on-surface-variant">${helper}</p>
        </article>
      `;
    }

    window.addEventListener("focus", renderRecetas);
    window.addEventListener("storage", renderRecetas);
    renderRecetas();
  </script>
</body>
</html>
