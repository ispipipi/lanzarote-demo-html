<!DOCTYPE html>
<html lang="es">
<head>

            "background": "#f7f9fb",
            "on-secondary-container": "#57657b",
            "on-secondary-fixed": "#0d1c2f",
            "on-secondary-fixed-variant": "#3a485c",
            "primary-fixed-dim": "#bec6e0",
            "outline": "#76777d",

            "error-container": "#ffdad6",

            "on-primary": "#ffffff",
            "on-primary-fixed-variant": "#3f465c",
            "tertiary": "#000000",
            "inverse-primary": "#bec6e0",
            "surface-container-high": "#e6e8ea",
            "surface-tint": "#565e74",
            "on-tertiary-container": "#75859d",
            "secondary-fixed-dim": "#b9c7e0",
            "tertiary-fixed": "#d3e4fe",
            "primary-container": "#131b2e",

          },
          borderRadius: {

            "data-md": ["JetBrains Mono", "monospace"]
          },
          fontSize: {

            "headline-md": ["24px", { lineHeight: "1.3", fontWeight: "600" }],
            "label-caps": ["11px", { lineHeight: "16px", letterSpacing: "0.06em", fontWeight: "700" }],
            "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],

          },

    };
  </script>
  <style>
    body { font-family: "Inter", sans-serif; }
    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      vertical-align: middle;
    }

<body class="min-h-screen bg-[radial-gradient(circle_at_top,_rgba(88,120,228,0.14),_transparent_26%),linear-gradient(180deg,_#f9fbff,_#eef3ff)] text-on-surface antialiased md:flex">
  <aside class="px-3 pt-3 md:h-screen md:w-[360px] md:shrink-0 md:p-6" id="sidebar"></aside>
  <main class="min-w-0 flex-1">
    <header class="sticky top-0 z-30 border-b border-outline-variant/80 bg-[rgba(247,249,251,0.82)] px-4 py-3 backdrop-blur-xl sm:px-6 md:px-container-padding" id="topbar"></header>
    <div class="mx-auto flex w-full max-w-none flex-col px-4 pb-6 pt-4 sm:px-6 sm:pt-5 md:p-container-padding md:pt-5" id="dashboard-root"></div>
  </main>
  <script src="state.js?v=20260709-ui6"></script>
  <script>
    const dashboardApi = window.LanzaroteState;

    function renderDashboard() {
      const snapshot = dashboardApi.recalcularDashboard();
      const state = snapshot.state;
      const metrics = snapshot.metrics;
      const urgentAlerts = state.alertas.filter((alert) => alert.severidad !== "baja").slice(0, 3);
      const today = dashboardApi.getToday();
      const currentMonth = today.slice(0, 7);
      const monthlyBudget = 6500000;
      const dailySalesBudget = Math.round(monthlyBudget / 30);

      const isSameDay = (value) => String(value || "").slice(0, 10) === today;
      const isCurrentMonth = (value) => String(value || "").slice(0, 7) === currentMonth;

      const salesTodayAmount = state.ventas
        .filter((sale) => isSameDay(sale.timestamp))
        .reduce((sum, sale) => sum + sale.monto, 0);
      const salesMonthAmount = state.ventas
        .filter((sale) => isCurrentMonth(sale.timestamp))
        .reduce((sum, sale) => sum + sale.monto, 0);
      const salesBudgetPct = Math.min(100, Math.round((salesMonthAmount / Math.max(1, monthlyBudget)) * 100));
      const salesDayPct = Math.min(100, Math.round((salesTodayAmount / Math.max(1, dailySalesBudget)) * 100));
      const salesGap = Math.max(0, monthlyBudget - salesMonthAmount);

      const productionTodayPlan = state.turnos
        .filter((turn) => isSameDay(turn.fecha))
        .reduce((sum, turn) => sum + turn.cantidadPlan, 0);
      const productionMonthPlan = state.turnos
        .filter((turn) => isCurrentMonth(turn.fecha))
        .reduce((sum, turn) => sum + turn.cantidadPlan, 0);
      const productionTodayUnits = state.turnos
        .filter((turn) => isSameDay(turn.fecha))
        .reduce((sum, turn) => sum + Math.max(0, turn.cantidadReal - turn.merma), 0);
      const productionMonthUnits = state.turnos
        .filter((turn) => isCurrentMonth(turn.fecha))
        .reduce((sum, turn) => sum + Math.max(0, turn.cantidadReal - turn.merma), 0);
      const productionTodayTurns = state.turnos.filter((turn) => isSameDay(turn.fecha)).length;
      const productionMonthTurns = state.turnos.filter((turn) => isCurrentMonth(turn.fecha)).length;
      const productionDayPct = productionTodayPlan ? Math.min(100, Math.round((productionTodayUnits / productionTodayPlan) * 100)) : 0;
      const productionMonthPct = productionMonthPlan ? Math.min(100, Math.round((productionMonthUnits / productionMonthPlan) * 100)) : 0;

      const deliveredShipments = state.pedidosDelivery.filter((order) => order.estado === "Entregada").length;
      const inTransitShipments = state.pedidosDelivery.filter((order) => order.estado === "En Ruta").length;
      const pendingShipments = state.pedidosDelivery.filter((order) => ["Pendiente de armar", "Cargada"].includes(order.estado)).length;
      const closedLoads = state.pedidosDelivery.filter((order) => order.cargaCerrada).length;
      const totalTrackedShipments = Math.max(1, deliveredShipments + inTransitShipments + pendingShipments);
      const deliveredPct = Math.round((deliveredShipments / totalTrackedShipments) * 100);
      const inTransitPct = Math.round((inTransitShipments / totalTrackedShipments) * 100);
      const pendingPct = Math.round((pendingShipments / totalTrackedShipments) * 100);
      const loadClosePct = Math.round((closedLoads / Math.max(1, state.pedidosDelivery.length || 1)) * 100);
      const highAlertCount = state.alertas.filter((alert) => alert.severidad === "alta").length;
      const mediumAlertCount = state.alertas.filter((alert) => alert.severidad === "media").length;
      const lowAlertCount = state.alertas.filter((alert) => alert.severidad === "baja").length;
      const topRecipeYield = metrics.recipeYieldByProduct.slice(0, 4);
      const topMixRows = metrics.productMix.slice(0, 4);
      const channelKpis = [
        { label: "Mesón", units: metrics.soldByChannel.meson?.units || 0, revenue: metrics.soldByChannel.meson?.revenue || 0, tone: "bg-[#39b980]" },
        { label: "Retiro", units: metrics.soldByChannel.retiro?.units || 0, revenue: metrics.soldByChannel.retiro?.revenue || 0, tone: "bg-[#2f57d3]" },
        { label: "Delivery", units: metrics.soldByChannel.delivery?.units || 0, revenue: metrics.soldByChannel.delivery?.revenue || 0, tone: "bg-[#ffb72b]" },
      ];
      const maxChannelUnits = Math.max(1, ...channelKpis.map((item) => item.units));

      dashboardApi.mountShell({
        activePage: "dashboard",
        allowPageScroll: true,
        title: "Panel de control",
        header: {
          eyebrow: "VISIÓN GLOBAL",
          badge: `${state.alertas.length} alertas activas`,
          badgeIcon: "analytics",
          secondaryActions: [
            { id: "dashboard-refresh", icon: "autorenew", label: "Refrescar" },
            { id: "dashboard-audit", icon: "query_stats", label: "Audit" },
          ],
          primaryAction: { id: "dashboard-reset", icon: "restart_alt", label: "Reset Demo" },
        },
      });

      const root = document.getElementById("dashboard-root");
      root.innerHTML = `
        <section class="grid gap-5 xl:grid-cols-[minmax(0,1fr)_320px]">
          <div class="grid gap-5">
            <section class="rounded-[32px] border border-[#dce4ff] bg-[radial-gradient(circle_at_top_left,_rgba(84,109,217,0.18),_transparent_30%),linear-gradient(135deg,_#ffffff,_#f7f9ff)] p-5 shadow-[0_22px_48px_rgba(47,87,211,0.08)] md:p-6">
              <div class="flex flex-col gap-4 xl:flex-row xl:items-end xl:justify-between">
                <div class="max-w-3xl">
                  <span class="inline-flex items-center gap-2 rounded-full border border-[#dce4ff] bg-white px-3 py-1 text-label-caps text-[#3556c5]">
                    <span class="material-symbols-outlined text-sm">campaign</span>
                    Panel ejecutivo de hoy
                  </span>
                  <h1 class="mt-4 text-[30px] font-bold leading-[1.02] tracking-[-0.04em] text-[#2341ae] md:text-[34px]">
                    Vista ejecutiva.
                  </h1>
                  <p class="mt-3 max-w-2xl text-body-md text-[#5f6f92]">
                    KPIs por módulo.
                  </p>
                </div>
                <div class="grid gap-3 md:grid-cols-3 xl:min-w-[480px]">
                  <div class="rounded-2xl border border-[#dce4ff] bg-white/88 px-4 py-3">
                    <p class="text-label-caps text-[#7181a3]">Ventas mes</p>
                    <p class="mt-2 text-[24px] font-bold leading-none tracking-[-0.03em] text-[#2341ae]">${dashboardApi.formatCurrency(salesMonthAmount)}</p>
                  </div>
                  <div class="rounded-2xl border border-[#dce4ff] bg-white/88 px-4 py-3">
                    <p class="text-label-caps text-[#7181a3]">Producción mes</p>
                    <p class="mt-2 text-[24px] font-bold leading-none tracking-[-0.03em] text-[#2341ae]">${productionMonthUnits.toLocaleString("es-CL")}</p>
                  </div>
                  <div class="rounded-2xl border border-[#dce4ff] bg-white/88 px-4 py-3">
                    <p class="text-label-caps text-[#7181a3]">Despachos hoy</p>
                    <p class="mt-2 text-[24px] font-bold leading-none tracking-[-0.03em] text-[#2341ae]">${deliveredShipments + inTransitShipments + pendingShipments}</p>
                  </div>
                </div>
              </div>
            </section>

            <section class="grid gap-4">
              <div class="grid gap-4 xl:grid-cols-2 2xl:grid-cols-3">
                ${sectionCard({
                  href: "sales.html?focus=plata",
                  icon: "paid",
                  eyebrow: "La plata",
                  title: "Ventas y presupuesto",
                  theme: "money",
                  heroValue: dashboardApi.formatCurrency(salesMonthAmount),
                  heroLabel: "Facturación mensual",
                  summary: `${dashboardApi.formatCurrency(salesTodayAmount)} hoy`,
                  compareItems: [
                    { icon: "today", label: "Hoy vs meta", value: `${salesDayPct}%` },
                    { icon: "monitoring", label: "Mes vs presupuesto", value: `${salesBudgetPct}%` },
                  ],
                  miniSeries: [
                    { label: "Hoy", value: salesDayPct, tone: "bg-[#ffb72b]" },
                    { label: "Mes", value: salesBudgetPct, tone: "bg-[#2f57d3]" },
                    { label: "Brecha", value: Math.min(100, Math.round((salesGap / Math.max(1, monthlyBudget)) * 100)), tone: "bg-[#dbe5ff]" },
                  ],
                  metrics: [
                    { icon: "today", label: "Ventas del día", value: dashboardApi.formatCurrency(salesTodayAmount) },
                    { icon: "calendar_month", label: "Ventas mensuales", value: dashboardApi.formatCurrency(salesMonthAmount) },
                    { icon: "target", label: "Cumplimiento", value: `${salesBudgetPct}%` },
                  ],
                  bars: [
                    { label: "Meta", value: salesBudgetPct, tone: "bg-[#ffb72b]" },
                    { label: "Brecha", value: Math.max(0, 100 - salesBudgetPct), tone: "bg-[#dbe5ff]" },
                  ],
                })}
                ${sectionCard({
                  href: "production.html?focus=operacion",
                  icon: "manufacturing",
                  eyebrow: "La operación",
                  title: "Producción día y mes",
                  theme: "operation",
                  heroValue: productionMonthUnits.toLocaleString("es-CL"),
                  heroLabel: "Unidades netas",
                  summary: `${productionTodayUnits.toLocaleString("es-CL")} hoy`,
                  compareItems: [
                    { icon: "factory", label: "Hoy vs plan", value: `${productionDayPct}%` },
                    { icon: "insights", label: "Mes vs plan", value: `${productionMonthPct}%` },
                  ],
                  miniSeries: [
                    { label: "Hoy", value: productionDayPct, tone: "bg-[#2f57d3]" },
                    { label: "Mes", value: productionMonthPct, tone: "bg-[#8aa3ff]" },
                    { label: "Precisión", value: metrics.productionAccuracy, tone: "bg-[#d7e2ff]" },
                  ],
                  metrics: [
                    { icon: "today", label: "Producción del día", value: productionTodayUnits.toLocaleString("es-CL") },
                    { icon: "date_range", label: "Producción mensual", value: productionMonthUnits.toLocaleString("es-CL") },
                    { icon: "tune", label: "Precisión", value: `${metrics.productionAccuracy}%` },
                  ],
                  bars: [
                    { label: "Peso del día", value: Math.min(100, Math.round((productionTodayUnits / Math.max(1, productionMonthUnits)) * 100)), tone: "bg-[#2f57d3]" },
                    { label: "Ajuste", value: Math.min(100, metrics.productionAccuracy), tone: "bg-[#8aa3ff]" },
                  ],
                })}
                ${sectionCard({
                  href: "distribution.html?focus=transito",
                  icon: "local_shipping",
                  eyebrow: "El tránsito",
                  title: "Logística y despacho",
                  theme: "transit",
                  heroValue: `${deliveredShipments}/${deliveredShipments + inTransitShipments + pendingShipments}`,
                  heroLabel: "Despachos entregados",
                  summary: `${inTransitShipments} en ruta ahora`,
                  compareItems: [
                    { icon: "route", label: "Entregados", value: `${deliveredPct}%` },
                    { icon: "inventory", label: "Cargas cerradas", value: `${loadClosePct}%` },
                  ],
                  miniSeries: [
                    { label: "Ok", value: deliveredPct, tone: "bg-[#39b980]" },
                    { label: "Ruta", value: inTransitPct, tone: "bg-[#2f57d3]" },
                    { label: "Pend.", value: pendingPct, tone: "bg-[#ffb72b]" },
                  ],
                  metrics: [
                    { icon: "check_circle", label: "Entregados", value: String(deliveredShipments) },
                    { icon: "route", label: "En tránsito", value: String(inTransitShipments) },
                    { icon: "inventory_2", label: "Por enviar", value: String(pendingShipments) },
                  ],
                  bars: [
                    { label: "Entregados", value: deliveredPct, tone: "bg-[#39b980]" },
                    { label: "Pendientes", value: pendingPct, tone: "bg-[#ffb72b]" },
                  ],
                })}
              </div>

              <section class="overflow-hidden rounded-[30px] border border-[#dce4ff] bg-white p-4 shadow-[0_18px_40px_rgba(47,87,211,0.06)]">
                <div class="flex flex-col gap-3 xl:flex-row xl:items-end xl:justify-between">
                  <div>
                    <p class="text-label-caps text-[#7181a3]">Indicadores del proceso</p>
                    <h2 class="mt-1.5 text-[24px] font-semibold tracking-[-0.03em] text-[#2341ae]">KPIs operativos y financieros</h2>
                    <p class="mt-1 text-body-sm text-[#607196]">Lectura compacta del proceso completo.</p>
                  </div>
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="rounded-full bg-[#f5f7ff] px-3 py-2 text-body-sm font-semibold text-[#3556c5]">${metrics.criticalStockCount} críticos</span>
                    <span class="rounded-full bg-[#fff5df] px-3 py-2 text-body-sm font-semibold text-[#9c6400]">${metrics.pendingClosures} cierres pendientes</span>
                  </div>
                </div>

                <div class="mt-4 grid gap-4 xl:grid-cols-[minmax(0,1.2fr)_320px]">
                  <div class="pr-1">
                    <div class="grid gap-3 md:grid-cols-2 2xl:grid-cols-3">
                      ${processKpiCard("menu_book", "Rendimiento por receta", `${Math.round(topRecipeYield.reduce((sum, item) => sum + item.pct, 0) / Math.max(1, topRecipeYield.length))}%`, `${topRecipeYield[0]?.producto || "Sin lote"} lidera`, "blue", "production.html?subview=recipes")}
                      ${processKpiCard("nutrition", "Desviación de consumo", `${metrics.consumptionDeviationPct > 0 ? "+" : ""}${metrics.consumptionDeviationPct}%`, `${metrics.actualConsumption.toFixed(1)} kg vs estándar`, metrics.consumptionDeviationPct > 2 ? "amber" : "green")}
                      ${processKpiCard("delete", "Merma total", `${metrics.totalProcessWaste.toLocaleString("es-CL")} u`, `Prod ${metrics.totalWaste} · vitrina ${metrics.showcaseUnits}`, "red")}
                      ${processKpiCard("payments", "Venta por canal", dashboardApi.formatCurrency(salesMonthAmount), `${channelKpis[0].units + channelKpis[1].units + channelKpis[2].units} u vendidas`, "blue", "sales.html?focus=channels")}
                      ${processKpiCard("bakery_dining", "Mix de producto", `${topMixRows[0]?.sharePct || 0}%`, topMixRows[0] ? `${topMixRows[0].producto}` : "Sin ventas", "amber", "sales.html?focus=mix")}
                      ${processKpiCard("verified", "Cumplimiento de entrega", `${metrics.deliveryCompliancePct}%`, `${deliveredShipments} entregados`, metrics.deliveryCompliancePct >= 80 ? "green" : "amber")}
                      ${processKpiCard("alt_route", "Diferencia de ruta", `${metrics.routeDifferenceUnits} u`, `${deliveredShipments} entregas cerradas`, metrics.routeDifferenceUnits > 0 ? "red" : "green")}
                      ${processKpiCard("account_balance_wallet", "Cobranza efectiva", `${metrics.effectiveCollectionsPct}%`, `${dashboardApi.formatCurrency(metrics.realCollections)} cobrados`, metrics.effectiveCollectionsPct >= 80 ? "green" : "amber", "sales.html?focus=collections")}
                      ${processKpiCard("point_of_sale", "Diferencia de rendición", dashboardApi.formatCurrency(metrics.renditionDifferenceAmount), `${dashboardApi.formatCurrency(metrics.renderedAmount)} rendidos`, metrics.renditionDifferenceAmount > 0 ? "amber" : "green")}
                      ${processKpiCard("inventory_2", "Stock crítico", `${metrics.criticalStockCount}`, `${metrics.lowStockCount} insumos · ${metrics.finishedCriticalCount} terminados`, metrics.criticalStockCount > 0 ? "red" : "green", "insumos.html?subview=stock")}
                      ${processKpiCard("event_busy", "Cierres pendientes", `${metrics.pendingClosures}`, `${state.asignacionesPendientes.length} asignaciones sin cerrar`, metrics.pendingClosures > 0 ? "amber" : "green", "dashboard.html?focus=closures")}
                      ${processKpiCard("task_alt", "Brechas cerradas", `${metrics.closedGapPct}%`, `${metrics.closedGaps} cerradas vs ${metrics.openGaps} abiertas`, metrics.closedGapPct >= 60 ? "green" : "blue")}
                    </div>
                  </div>

                  <div class="grid gap-3 xl:grid-rows-[auto_auto_1fr]">
                    <a class="block rounded-[24px] border border-outline-variant bg-[linear-gradient(180deg,_#f5f8ff,_#ffffff)] p-4 shadow-soft transition-transform hover:-translate-y-[1px]" href="sales.html?focus=channels">
                      <div class="flex items-center justify-between gap-3">
                        <div>
                          <p class="text-label-caps text-[#7181a3]">Venta por canal</p>
                          <h3 class="mt-1.5 text-[18px] font-semibold text-[#2341ae]">Volumen y monto</h3>
                        </div>
                        <div class="flex items-center gap-2">
                          <span class="material-symbols-outlined text-[#3556c5]">stacked_bar_chart</span>
                          <span class="material-symbols-outlined text-[#9aa8cb]">arrow_outward</span>
                        </div>
                      </div>
                      <div class="mt-3 space-y-3">
                        ${channelKpis.map((item) => `
                          <div>
                            <div class="mb-1.5 flex items-center justify-between gap-3">
                              <span class="text-body-sm font-medium text-[#607196]">${item.label}</span>
                              <span class="text-body-sm font-semibold text-[#2341ae]">${item.units} u · ${dashboardApi.formatCurrency(item.revenue)}</span>
                            </div>
                            <div class="h-2.5 overflow-hidden rounded-full bg-[#e8eeff]">
                              <div class="h-full rounded-full ${item.tone}" style="width:${Math.max(8, Math.round((item.units / maxChannelUnits) * 100))}%"></div>
                            </div>
                          </div>
                        `).join("")}
                      </div>
                    </a>

                    <a class="block rounded-[24px] border border-outline-variant bg-[linear-gradient(180deg,_#fff8ea,_#ffffff)] p-4 shadow-soft transition-transform hover:-translate-y-[1px]" href="sales.html?focus=mix">
                      <div class="flex items-center justify-between gap-3">
                        <div>
                          <p class="text-label-caps text-[#9c6400]">Mix de producto</p>
                          <h3 class="mt-1.5 text-[18px] font-semibold text-[#7a4f00]">Participación en venta</h3>
                        </div>
                        <div class="flex items-center gap-2">
                          <span class="material-symbols-outlined text-[#9c6400]">donut_large</span>
                          <span class="material-symbols-outlined text-[#9aa8cb]">arrow_outward</span>
                        </div>
                      </div>
                      <div class="mt-3 space-y-2.5">
                        ${topMixRows.map((item) => `
                          <div class="rounded-2xl bg-white/92 px-3 py-3 shadow-[0_10px_22px_rgba(47,87,211,0.05)]">
                            <div class="flex items-center justify-between gap-3">
                              <span class="text-body-sm font-medium text-[#607196]">${item.producto}</span>
                              <span class="font-data-md text-[#2341ae]">${item.sharePct}%</span>
                            </div>
                            <div class="mt-2 h-2.5 overflow-hidden rounded-full bg-[#f2e6c9]">
                              <div class="h-full rounded-full bg-[#ffb72b]" style="width:${Math.max(8, item.sharePct)}%"></div>
                            </div>
                          </div>
                        `).join("") || '<p class="rounded-2xl bg-white/90 px-3 py-3 text-body-sm text-[#607196]">Sin ventas para calcular mix.</p>'}
                      </div>
                    </a>

                    <a class="block overflow-hidden rounded-[24px] border border-outline-variant bg-white p-4 shadow-soft transition-transform hover:-translate-y-[1px]" href="production.html?subview=recipes">
                      <div class="flex items-center justify-between gap-3">
                        <div>
                          <p class="text-label-caps text-[#7181a3]">Rendimiento por receta</p>
                          <h3 class="mt-1.5 text-[18px] font-semibold text-[#2341ae]">Top de cumplimiento</h3>
                        </div>
                        <div class="flex items-center gap-2">
                          <span class="material-symbols-outlined text-[#3556c5]">monitoring</span>
                          <span class="material-symbols-outlined text-[#9aa8cb]">arrow_outward</span>
                        </div>
                      </div>
                      <div class="mt-3 space-y-2 pr-1">
                        ${topRecipeYield.map((item) => `
                          <div class="rounded-2xl bg-surface-container-low px-3 py-3">
                            <div class="flex items-center justify-between gap-3">
                              <span class="text-body-sm font-medium text-[#607196]">${item.producto}</span>
                              <span class="font-data-md text-[#2341ae]">${item.pct}%</span>
                            </div>
                            <div class="mt-2 h-2.5 overflow-hidden rounded-full bg-[#e8eeff]">
                              <div class="h-full rounded-full ${item.pct >= 95 ? "bg-[#39b980]" : item.pct >= 85 ? "bg-[#ffb72b]" : "bg-[#ff7a66]"}" style="width:${Math.max(8, Math.min(100, item.pct))}%"></div>
                            </div>
                          </div>
                        `).join("") || '<p class="rounded-2xl bg-surface-container-low px-3 py-3 text-body-sm text-[#607196]">Sin turnos aún.</p>'}
                      </div>
                    </a>
                  </div>
                </div>
              </section>
            </section>
          </div>

          <aside class="grid gap-4 xl:grid-rows-[auto_auto_1fr]">
            <section class="overflow-hidden rounded-[30px] bg-[radial-gradient(circle_at_top_right,_rgba(145,176,255,0.22),_transparent_28%),linear-gradient(180deg,_#2f57d3,_#2444aa)] p-5 text-white shadow-[0_22px_48px_rgba(47,87,211,0.22)]">
              <div class="flex items-start justify-between gap-4">
                <div>
                  <p class="text-label-caps text-[#c8d6ff]">Focos prioritarios</p>
                  <h2 class="mt-2 text-[24px] font-semibold tracking-[-0.03em]">Focos del día</h2>
                </div>
                <span class="rounded-full bg-white/10 px-3 py-1 text-body-sm">${urgentAlerts.length} frentes</span>
              </div>
              <div class="mt-4 grid grid-cols-2 gap-3">
                <div class="rounded-2xl bg-white/10 px-4 py-3">
                  <p class="text-label-caps text-[#d7e0ff]">Críticas</p>
                  <p class="mt-1 text-[24px] font-bold leading-none">${highAlertCount}</p>
                </div>
                <div class="rounded-2xl bg-white/10 px-4 py-3">
                  <p class="text-label-caps text-[#d7e0ff]">Medias</p>
                  <p class="mt-1 text-[24px] font-bold leading-none">${mediumAlertCount}</p>
                </div>
              </div>
            </section>

            <section class="grid grid-cols-3 gap-2">
              <div class="rounded-[24px] border border-[#ffd8d2] bg-[#fff2f0] px-3 py-3">
                <p class="text-label-caps text-[#d14b3f]">Altas</p>
                <p class="mt-1 text-[22px] font-bold leading-none text-[#9f3026]">${highAlertCount}</p>
              </div>
              <div class="rounded-[24px] border border-[#dde5ff] bg-[#f5f7ff] px-3 py-3">
                <p class="text-label-caps text-[#3556c5]">Medias</p>
                <p class="mt-1 text-[22px] font-bold leading-none text-[#2341ae]">${mediumAlertCount}</p>
              </div>
              <div class="rounded-[24px] border border-[#ebf0ff] bg-[#f8faff] px-3 py-3">
                <p class="text-label-caps text-[#7a86a4]">Bajas</p>
                <p class="mt-1 text-[22px] font-bold leading-none text-[#607196]">${lowAlertCount}</p>
              </div>
            </section>

            <section class="rounded-[30px] border border-[#dce4ff] bg-white p-5 shadow-[0_18px_40px_rgba(47,87,211,0.06)]">
              <div class="flex items-center justify-between gap-3">
                <div>
                  <p class="text-label-caps text-[#7181a3]">Alertas activas</p>
                  <h2 class="mt-2 text-[24px] font-semibold tracking-[-0.03em] text-[#2341ae]">Alertas y desvíos</h2>
                </div>
                <span class="rounded-full bg-[#f5f7ff] px-3 py-1 text-body-sm font-semibold text-[#3556c5]">${state.alertas.length}</span>
              </div>
              <div class="mt-4 grid gap-3">
                ${state.alertas.slice(0, 3).map((alert) => `
                  <article class="rounded-[22px] border ${alert.severidad === "alta" ? "border-[#ffd8d2] bg-[#fff2f0]" : alert.severidad === "media" ? "border-[#dde5ff] bg-[#f5f7ff]" : "border-[#ebf0ff] bg-[#f8faff]"} p-4">
                    <div class="flex items-start gap-3">
                      <span class="material-symbols-outlined rounded-xl p-2 ${alert.severidad === "alta" ? "bg-[#ffe0db] text-[#d14b3f]" : alert.severidad === "media" ? "bg-[#e8eeff] text-[#2f57d3]" : "bg-[#edf2ff] text-[#6f7fa1]"}">${alert.severidad === "alta" ? "warning" : alert.severidad === "media" ? "notifications_active" : "info"}</span>
                      <div class="min-w-0 flex-1">
                        <div class="flex items-center justify-between gap-3">
                          <span class="text-label-caps ${alert.severidad === "alta" ? "text-[#d14b3f]" : "text-[#6f7fa1]"}">${alert.tipo}</span>
                          <span class="text-body-sm font-semibold ${alert.severidad === "alta" ? "text-[#d14b3f]" : "text-[#2341ae]"}">${alert.severidad}</span>
                        </div>
                        <p class="mt-2 text-body-md ${alert.severidad === "alta" ? "text-[#7a342c]" : "text-[#607196]"}">${dashboardApi.escapeHtml(alert.mensaje)}</p>
                      </div>
                    </div>
                  </article>
                `).join("") || '<p class="rounded-2xl bg-[#f8faff] p-4 text-body-md text-[#607196]">Sin alertas relevantes por ahora.</p>'}
              </div>
            </section>
          </aside>
        </section>
      `;

      document.getElementById("dashboard-refresh").addEventListener("click", renderDashboard);
      document.getElementById("dashboard-audit").addEventListener("click", () => {
        window.location.href = "dashboard.html";
      });
      document.getElementById("dashboard-reset").addEventListener("click", () => {
        dashboardApi.resetState();
        renderDashboard();
      });
    }

    function sectionCard({ href, icon, eyebrow, title, theme, heroValue, heroLabel, summary, compareItems, miniSeries, metrics, bars }) {
      const palette = {
        money: {
          wrapper: "border-[#ffe0a0] bg-[linear-gradient(180deg,_#fff7e7,_#ffffff)]",
          badge: "bg-[#fff0c8] text-[#9c6400]",
          title: "text-[#7a4f00]",
          metricValue: "text-[#2341ae]",
          helper: "text-[#7b829d]",
          halo: "rgba(255,183,43,0.26)",
          iconWrap: "bg-[#fff0c8] text-[#9c6400]",
          compare: "bg-[#fff6e0] text-[#9c6400]",
        },
        operation: {
          wrapper: "border-[#dce4ff] bg-[linear-gradient(180deg,_#f5f8ff,_#ffffff)]",
          badge: "bg-[#e8eeff] text-[#2f57d3]",
          title: "text-[#2341ae]",
          metricValue: "text-[#2341ae]",
          helper: "text-[#7080a3]",
          halo: "rgba(47,87,211,0.22)",
          iconWrap: "bg-[#e8eeff] text-[#2f57d3]",
          compare: "bg-[#eef3ff] text-[#2f57d3]",
        },
        transit: {
          wrapper: "border-[#dce4ff] bg-[linear-gradient(180deg,_#eef4ff,_#ffffff)]",
          badge: "bg-[#e6efff] text-[#2f57d3]",
          title: "text-[#2341ae]",
          metricValue: "text-[#2341ae]",
          helper: "text-[#7080a3]",
          halo: "rgba(57,185,128,0.2)",
          iconWrap: "bg-[#edf2ff] text-[#2f57d3]",
          compare: "bg-[#eef4ff] text-[#2f57d3]",
        },
      };

      const selected = palette[theme] || palette.operation;
      const heroPct = bars[0] ? Math.max(6, Math.min(100, bars[0].value)) : 0;
      const sparkValues = miniSeries || [];

      return `
        <a class="group flex h-full min-h-0 flex-col rounded-[30px] border ${selected.wrapper} p-5 shadow-[0_18px_40px_rgba(47,87,211,0.06)] transition-transform duration-150 hover:-translate-y-1" href="${href}">
          <div class="flex items-start justify-between gap-4">
            <div>
              <span class="inline-flex items-center gap-2 rounded-full px-3 py-1 text-label-caps ${selected.badge}">
                <span class="material-symbols-outlined text-sm">${icon}</span>
                ${eyebrow}
              </span>
              <h2 class="mt-3 text-[20px] font-bold leading-[1.05] tracking-[-0.03em] ${selected.title} md:text-[22px]">${title}</h2>
              <p class="mt-2 text-body-sm ${selected.helper}">${summary}</p>
            </div>
            <div class="flex items-center gap-3">
              <div class="relative grid h-12 w-12 place-items-center rounded-full bg-white shadow-[0_12px_24px_rgba(47,87,211,0.08)]" style="background:conic-gradient(${selected.halo} ${heroPct}%, #eef2ff 0);">
                <div class="grid h-8 w-8 place-items-center rounded-full bg-white">
                  <span class="material-symbols-outlined ${selected.title}">${icon}</span>
                </div>
              </div>
              <span class="material-symbols-outlined text-[#9aa8cb] transition-transform group-hover:translate-x-1">arrow_outward</span>
            </div>
          </div>

          <div class="mt-4 grid gap-3 lg:grid-cols-[minmax(0,1fr)_132px]">
            <div class="rounded-[22px] bg-white/92 p-4 shadow-[0_12px_24px_rgba(47,87,211,0.05)]">
              <p class="text-label-caps text-[#7a86a4]">${heroLabel}</p>
              <p class="mt-2 text-[24px] font-bold leading-none tracking-[-0.04em] md:text-[28px] ${selected.metricValue}">${heroValue}</p>
              <p class="mt-2 text-body-sm ${selected.helper}">${summary}</p>
            </div>

            <div class="rounded-[22px] bg-white/92 p-4 shadow-[0_12px_24px_rgba(47,87,211,0.05)]">
              <p class="text-label-caps text-[#7a86a4]">Pulso</p>
              <div class="mt-4 flex h-[66px] items-end justify-between gap-2">
                ${sparkValues.map((item) => `
                  <div class="flex flex-1 flex-col items-center gap-1.5">
                    <div class="flex w-full items-end justify-center rounded-t-2xl ${item.tone}" style="height:${Math.max(14, Math.min(52, item.value))}px"></div>
                    <span class="text-[10px] font-semibold text-[#607196]">${item.label}</span>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>

          <div class="mt-4 grid gap-2">
            ${(compareItems || []).map((item) => `
              <div class="flex items-center justify-between gap-3 rounded-2xl bg-white/78 px-3 py-2">
                <div class="flex items-center gap-2">
                  <span class="material-symbols-outlined text-[16px] ${selected.title}">${item.icon}</span>
                  <span class="text-body-sm font-semibold text-[#607196]">${item.label}</span>
                </div>
                <span class="text-body-sm font-semibold ${selected.metricValue}">${item.value}</span>
              </div>
            `).join("")}
          </div>

          <div class="mt-4 space-y-2">
            ${metrics.map((metric) => `
              <div class="flex items-center justify-between gap-3 rounded-2xl bg-white/92 px-4 py-3 shadow-[0_10px_22px_rgba(47,87,211,0.05)]">
                <div class="flex min-w-0 items-center gap-3">
                  <span class="material-symbols-outlined rounded-xl p-2 ${selected.iconWrap}">${metric.icon || "insights"}</span>
                  <div class="min-w-0">
                    <p class="text-label-caps text-[#7a86a4]">${metric.label}</p>
                  </div>
                </div>
                <p class="shrink-0 font-data-md ${selected.metricValue}">${metric.value}</p>
              </div>
            `).join("")}
          </div>

          <div class="mt-auto space-y-2 pt-4">
            ${bars.map((bar) => `
              <div>
                <div class="mb-1.5 flex items-center justify-between gap-3">
                  <span class="text-body-sm font-medium text-[#607196]">${bar.label}</span>
                  <span class="text-body-sm font-semibold text-[#2341ae]">${bar.value}%</span>
                </div>
                <div class="h-2.5 overflow-hidden rounded-full bg-[#e8eeff]">
                  <div class="h-full rounded-full ${bar.tone}" style="width:${Math.max(6, Math.min(100, bar.value))}%"></div>
                </div>
              </div>
            `).join("")}
          </div>
        </a>
      `;
    }

    function processKpiCard(icon, label, value, helper, tone = "blue", href = "") {
      const palette = {
        blue: {
          wrap: "border-[#dce4ff] bg-[#f5f8ff]",
          icon: "bg-white text-[#2f57d3]",
          value: "text-[#2341ae]",
        },
        green: {
          wrap: "border-[#d6efdf] bg-[#f3fff7]",
          icon: "bg-white text-[#1b8b5c]",
          value: "text-[#146b48]",
        },
        amber: {
          wrap: "border-[#ffe0a0] bg-[#fff7e7]",
          icon: "bg-white text-[#9c6400]",
          value: "text-[#7a4f00]",
        },
        red: {
          wrap: "border-[#ffd8d2] bg-[#fff2f0]",
          icon: "bg-white text-[#d14b3f]",
          value: "text-[#9f3026]",
        },
      }[tone];

      const Tag = href ? "a" : "article";
      const attrs = href ? ` href="${href}"` : "";
      const actionClass = href ? " transition-transform hover:-translate-y-[1px]" : "";
      const actionIcon = href ? '<span class="material-symbols-outlined text-[#9aa8cb]">arrow_outward</span>' : "";

      return `
        <${Tag}${attrs} class="block rounded-[22px] border ${palette.wrap} px-4 py-3 shadow-[0_10px_22px_rgba(47,87,211,0.05)]${actionClass}">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <p class="text-label-caps text-[#7a86a4]">${label}</p>
              <p class="mt-2 text-[24px] font-bold leading-none tracking-[-0.03em] ${palette.value}">${value}</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined rounded-xl p-2 ${palette.icon}">${icon}</span>
              ${actionIcon}
            </div>
          </div>
          <p class="mt-2 text-body-sm text-[#607196]">${helper}</p>
        </${Tag}>
      `;
    }

    window.addEventListener("focus", renderDashboard);
    window.addEventListener("storage", renderDashboard);
    renderDashboard();
  </script>
</body>
</html>
