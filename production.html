<body class="min-h-screen bg-[radial-gradient(circle_at_top_left,_rgba(255,222,173,0.38),_transparent_22%),radial-gradient(circle_at_top,_rgba(213,227,253,0.28),_transparent_30%),linear-gradient(180deg,_#fffaf1,_#f4efe5_52%,_#eef2f6)] text-on-surface antialiased sm:flex">
  <aside class="px-3 pt-3 sm:h-screen sm:w-[360px] sm:shrink-0 sm:p-6" id="sidebar"></aside>
  <main class="min-w-0 flex-1">
    <header class="sticky top-0 z-30 border-b border-outline-variant/80 bg-[rgba(247,249,251,0.82)] px-4 py-4 backdrop-blur-xl sm:min-h-[88px] sm:px-container-padding" id="topbar"></header>
    <div class="mx-auto flex h-full w-full max-w-none min-h-0 flex-col px-4 pb-4 pt-4 sm:p-container-padding sm:pt-5" id="production-root"></div>
  </main>
  <script src="state.js?v=20260709-ui6"></script>
  <script>
    const productionApi = window.LanzaroteState;
    const productionParams = new URLSearchParams(window.location.search);
    let productionSubview = productionParams.get("subview") || "turns";
    let productionDraft = {};
    let productionConsumptionDrafts = {};
    let recipeDrafts = {};
    let productionSession = {};

    function formatNumber(value, digits = 0) {
      return Number(value || 0).toLocaleString("es-CL", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits,
      });
    }

    function buildDraft(state) {
      return state.productos.reduce((accumulator, product) => {
        accumulator[product.id] = {
          plan: product.rendimientoEsperado,
          real: product.rendimientoEsperado,
          merma: Math.max(2, Math.round(product.rendimientoEsperado * 0.02)),
        };
        return accumulator;
      }, {});
    }

    function buildRecipeDrafts(state) {
      return state.productos.reduce((accumulator, product) => {
        accumulator[product.id] = {
          rendimiento: product.rendimientoEsperado,
          tolerancia: product.toleranciaPct || 3,
          ingredientes: product.recetaInsumos.reduce((ingredientAccumulator, ingredient) => {
            ingredientAccumulator[ingredient.insumoId] = ingredient.cantidad;
            return ingredientAccumulator;
          }, {}),
        };
        return accumulator;
      }, {});
    }

    function buildSessionDraft(state) {
      return {
        date: productionApi.getToday(),
        shift: "Mañana",
        manager: "Jefe de producción",
        team: "Equipo hornos AM",
        notes: "",
        activeProduct: state.productos[0]?.id || "",
        activeOrderId: "",
      };
    }

    function ensureDraft(state) {
      if (!Object.keys(productionDraft).length) {
        productionDraft = buildDraft(state);
      }
      state.productos.forEach((product) => {
        if (!productionDraft[product.id]) {
          productionDraft[product.id] = {
            plan: product.rendimientoEsperado,
            real: product.rendimientoEsperado,
            merma: Math.max(2, Math.round(product.rendimientoEsperado * 0.02)),
          };
        }
      });
    }

    function buildConsumptionDraftForOrder(state, order) {
      const product = state.productos.find((item) => item.id === order.productoId);
      if (!product) {
        return [];
      }
      const factor = product.rendimientoEsperado > 0 ? Number(order.cantidadPlan || 0) / product.rendimientoEsperado : 0;
      return product.recetaInsumos.map((item) => ({
        insumoId: item.insumoId,
        cantidad: Math.round((item.cantidad * factor) * 100) / 100,
      }));
    }

    function ensureRecipeDrafts(state) {
      if (!Object.keys(recipeDrafts).length) {
        recipeDrafts = buildRecipeDrafts(state);
      }
      state.productos.forEach((product) => {
        if (!recipeDrafts[product.id]) {
          recipeDrafts[product.id] = {
            rendimiento: product.rendimientoEsperado,
            tolerancia: product.toleranciaPct || 3,
            ingredientes: product.recetaInsumos.reduce((accumulator, ingredient) => {
              accumulator[ingredient.insumoId] = ingredient.cantidad;
              return accumulator;
            }, {}),
          };
        }
      });
    }

    function ensureConsumptionDrafts(state) {
      state.ordenesProduccion
        .filter((order) => order.estado === "Activa")
        .forEach((order) => {
          if (!productionConsumptionDrafts[order.id]) {
            productionConsumptionDrafts[order.id] = buildConsumptionDraftForOrder(state, order);
          }
        });
    }

    function ensureSessionDraft(state) {
      if (!productionSession.activeProduct) {
        productionSession = buildSessionDraft(state);
      }
      if (!state.productos.find((product) => product.id === productionSession.activeProduct)) {
        productionSession.activeProduct = state.productos[0]?.id || "";
      }
      if (productionSession.activeOrderId && !state.ordenesProduccion.find((order) => order.id === productionSession.activeOrderId)) {
        productionSession.activeOrderId = "";
      }
    }

    function syncProductionSubviewUrl(nextSubview) {
      const nextParams = new URLSearchParams(window.location.search);
      nextParams.set("subview", nextSubview);
      window.history.replaceState({}, "", `${window.location.pathname}?${nextParams.toString()}`);
      productionSubview = nextSubview;
    }

    function getSubviewMeta() {
      return {
        recipes: {
          id: "recipes",
          label: "Recetas y reglas",
          helper: "Fórmula activa",
          title: "Recetas",
          subtitle: "Costo, carga y tolerancia.",
          eyebrow: "Formulación activa",
          primaryLabel: "Guardar recetas",
          primaryIcon: "rule_settings",
        },
        turns: {
          id: "turns",
          label: "Producción por turno",
          helper: "Turno y consumo",
          title: "Turno activo",
          subtitle: "Orden, consumo y cierre.",
          eyebrow: "Operación activa",
          primaryLabel: "Cerrar orden",
          primaryIcon: "task_alt",
        },
        finished: {
          id: "finished",
          label: "Producto terminado",
          helper: "Stock final",
          title: "Producto terminado",
          subtitle: "Disponible, asignado y destino.",
          eyebrow: "Salida productiva",
          primaryLabel: "Ir a distribución",
          primaryIcon: "local_shipping",
        },
      }[productionSubview] || {
        id: "turns",
        label: "Producción por turno",
        helper: "Turno y consumo",
        title: "Turno activo",
        subtitle: "Orden, consumo y cierre.",
        eyebrow: "Operación activa",
        primaryLabel: "Cerrar turno",
        primaryIcon: "task_alt",
      };
    }

    function getToleranceState(product, expected, real) {
      const deltaPct = expected <= 0 ? 0 : ((real - expected) / expected) * 100;
      const tolerance = Number(product.toleranciaPct || 3);

      if (deltaPct < -tolerance) {
        return {
          pct: deltaPct,
          label: "Bajo rendimiento",
          toneClass: "bg-error-container text-on-error-container",
          barClass: "bg-error",
        };
      }

      if (deltaPct > tolerance) {
        return {
          pct: deltaPct,
          label: "Sobreconsumo / sobreproducción",
          toneClass: "bg-secondary-fixed text-on-secondary-fixed",
          barClass: "bg-secondary",
        };
      }

      return {
        pct: deltaPct,
        label: "Dentro de tolerancia",
        toneClass: "bg-tertiary-fixed text-on-tertiary-fixed",
        barClass: "bg-on-tertiary-container",
      };
    }

    function estimateRecipeCost(product, ingredientMap) {
      return product.recetaInsumos.reduce((sum, ingredient) => {
        const supply = ingredientMap[ingredient.insumoId];
        return sum + (supply ? supply.precioReferencia * ingredient.cantidad : 0);
      }, 0);
    }

    function buildFinishedRows(state) {
      const productMap = productionApi.getProductMap(state);
      const assignedByProduct = state.canales.reduce((accumulator, channel) => {
        channel.stock.forEach((item) => {
          accumulator[item.productoId] = (accumulator[item.productoId] || 0) + item.cantidad;
        });
        return accumulator;
      }, {});

      return state.stockTerminado
        .map((item) => ({
          ...item,
          product: productMap[item.productoId],
          reservadoCanales: assignedByProduct[item.productoId] || 0,
          disponibleReal: Math.max(0, item.cantidadDisponible),
        }))
        .sort((a, b) => b.disponibleReal - a.disponibleReal);
    }

    function summaryCard(icon, label, value, helper, tone = "default") {
      const palette = {
        default: "border-outline-variant bg-white",
        soft: "border-[#dce4ff] bg-[#f4f7ff]",
        alert: "border-error/10 bg-error-container/50",
        warm: "border-[#ffd489] bg-[#fff5df]",
        dark: "border-white/10 bg-white/10 text-white",
      }[tone];

      return `
        <article class="rounded-[18px] border ${palette} px-3 py-2.5 shadow-soft">
          <div class="flex items-start justify-between gap-3">
            <div>
              <p class="text-label-caps ${tone === "dark" ? "text-primary-fixed-dim" : "text-on-surface-variant"}">${label}</p>
              <p class="mt-1 font-data-md ${tone === "dark" ? "text-white" : "text-primary"}">${value}</p>
            </div>
            <span class="material-symbols-outlined ${tone === "dark" ? "text-white/80" : "text-[#3556c5]"}">${icon}</span>
          </div>
          <p class="mt-1.5 text-[10px] leading-4 ${tone === "dark" ? "text-primary-fixed-dim" : "text-on-surface-variant"}">${helper}</p>
        </article>
      `;
    }

    function recipeCard(product, ingredientMap) {
      const draft = recipeDrafts[product.id];
      const cost = estimateRecipeCost(product, ingredientMap);
      const totalKg = product.recetaInsumos.reduce((sum, ingredient) => sum + Number(draft.ingredientes[ingredient.insumoId] || 0), 0);
      const averageUnitCost = draft.rendimiento > 0 ? cost / draft.rendimiento : 0;
      const toleranceTone = Number(draft.tolerancia || 0) <= 3
        ? { label: "Precisa", chip: "bg-[#eef6ef] text-[#24704a]", bar: "bg-[#4fa875]" }
        : Number(draft.tolerancia || 0) <= 4
          ? { label: "Flexible", chip: "bg-[#edf2ff] text-[#2f57d3]", bar: "bg-[#6b87ee]" }
          : { label: "Sensitiva", chip: "bg-[#fff2df] text-[#b46b00]", bar: "bg-[#f1b33f]" };

      return `
        <article class="rounded-[30px] border border-[#ead7b2] bg-[radial-gradient(circle_at_top_left,_rgba(255,222,173,0.16),_transparent_24%),linear-gradient(180deg,_#ffffff,_#fffaf2)] p-5 shadow-soft">
          <div class="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-2">
                <span class="rounded-full bg-[#fff3dc] px-3 py-1 text-body-sm font-semibold text-[#b46b00]">${product.recetaId}</span>
                <span class="rounded-full px-3 py-1 text-body-sm font-semibold ${toleranceTone.chip}">${toleranceTone.label}</span>
              </div>
              <h3 class="mt-3 text-[24px] font-semibold tracking-[-0.03em] text-primary">${product.nombre}</h3>
              <p class="mt-1.5 max-w-2xl text-body-sm text-on-surface-variant">${product.equipo}</p>
            </div>
            <div class="grid min-w-[210px] gap-2 sm:grid-cols-3 xl:grid-cols-1">
              ${summaryCard("payments", "Costo unit.", `${productionApi.formatCurrency(averageUnitCost)}`, "referencia", "soft")}
              ${summaryCard("scale", "Carga lote", `${formatNumber(totalKg, 1)} kg`, "mezcla base", "warm")}
              ${summaryCard("rule", "Tolerancia", `±${formatNumber(draft.tolerancia)}%`, "permitida", "default")}
            </div>
          </div>

          <div class="mt-5 rounded-[24px] border border-[#efe2c6] bg-[#fffdf8] p-4">
            <div class="flex items-center justify-between gap-3">
              <p class="text-label-caps text-[#8f775c]">Fórmula editable</p>
              <span class="rounded-full bg-white px-3 py-1 text-body-sm text-on-surface-variant shadow-soft">${product.recetaInsumos.length} insumos</span>
            </div>
            <div class="mt-4 grid gap-3 md:grid-cols-2">
            ${product.recetaInsumos.map((ingredient) => {
              const supply = ingredientMap[ingredient.insumoId];
              const quantity = Number(draft.ingredientes[ingredient.insumoId] || 0);
              const unitConsumption = draft.rendimiento > 0 ? Math.round((quantity * 1000) / draft.rendimiento) : 0;
              const mixShare = totalKg > 0 ? Math.round((quantity / totalKg) * 100) : 0;
              const ingredientUnitCost = draft.rendimiento > 0 && supply
                ? (quantity * supply.precioReferencia) / draft.rendimiento
                : 0;
              return `
                <div class="rounded-2xl border border-[#f1e7d2] bg-white p-4 shadow-soft">
                  <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0">
                      <p class="text-body-md font-semibold text-primary">${productionApi.escapeHtml(supply.nombre)}</p>
                      <p class="mt-1 text-body-sm text-on-surface-variant">${formatNumber(supply.stock, 1)} ${supply.unidad} disponibles</p>
                    </div>
                    <span class="rounded-full bg-[#f7f8fb] px-3 py-1 font-data-md text-primary">${unitConsumption} g/u</span>
                  </div>
                  <div class="mt-3 grid gap-2 sm:grid-cols-[132px_minmax(0,1fr)]">
                    <label class="rounded-xl bg-[#fff7ea] px-3 py-2">
                      <span class="text-label-caps text-on-surface-variant">kg/lote</span>
                      <input class="mt-1 w-full rounded-lg border border-outline-variant bg-white px-2 py-1 font-data-md text-primary" data-recipe-ingredient="${ingredient.insumoId}" data-product="${product.id}" min="0" step="0.1" type="number" value="${quantity}"/>
                    </label>
                    <div class="rounded-xl bg-surface-container-low px-3 py-2">
                      <div class="flex items-center justify-between text-body-sm">
                        <span class="text-on-surface-variant">Peso en mezcla</span>
                        <span class="font-data-md text-primary">${mixShare}%</span>
                      </div>
                      <div class="mt-2 h-2 overflow-hidden rounded-full bg-[#f2e8d8]">
                        <div class="h-full ${toleranceTone.bar}" style="width:${Math.max(8, mixShare)}%"></div>
                      </div>
                      <p class="mt-2 text-body-sm text-on-surface-variant">Costo ${productionApi.formatCurrency(ingredientUnitCost)}</p>
                    </div>
                  </div>
                </div>
              `;
            }).join("")}
            </div>
          </div>

          <div class="mt-5 grid gap-3 md:grid-cols-3">
            <label class="rounded-2xl bg-[#fff7ea] p-4">
              <span class="text-label-caps text-on-surface-variant">Rendimiento esperado</span>
              <input class="mt-2 w-full rounded-xl border border-outline-variant bg-white px-3 py-2 font-data-md text-primary" data-recipe-field="rendimiento" data-product="${product.id}" min="1" type="number" value="${draft.rendimiento}"/>
            </label>
            <label class="rounded-2xl bg-[#f4f7ff] p-4">
              <span class="text-label-caps text-on-surface-variant">Tolerancia permitida</span>
              <input class="mt-2 w-full rounded-xl border border-outline-variant bg-white px-3 py-2 font-data-md text-primary" data-recipe-field="tolerancia" data-product="${product.id}" min="1" type="number" value="${draft.tolerancia}"/>
            </label>
            <div class="rounded-2xl bg-surface-container-low p-4">
              <p class="text-label-caps text-on-surface-variant">Costo lote</p>
              <p class="mt-2 font-data-md text-primary">${productionApi.formatCurrency(cost)}</p>
              <p class="mt-2 text-body-sm text-on-surface-variant">referencia actual</p>
            </div>
          </div>

          <div class="mt-5 flex flex-wrap items-center justify-between gap-3">
            <p class="text-body-sm text-on-surface-variant">Lista para producción.</p>
            <div class="flex flex-wrap items-center gap-2">
              <button class="rounded-full border border-[#dce4ff] bg-[#f5f8ff] px-4 py-2 text-body-sm font-semibold text-[#2f57d3]" data-open-recipe-modal="${product.id}" type="button">Ver flujo</button>
              <button class="rounded-full bg-primary px-4 py-2 text-body-sm font-semibold text-white shadow-[0_12px_24px_rgba(19,27,46,0.18)]" data-save-recipe="${product.id}" type="button">Guardar receta activa</button>
            </div>
          </div>
        </article>
      `;
    }

    function turnPlanCard(product) {
      const draft = productionDraft[product.id];
      const yieldState = getToleranceState(product, Number(draft.plan || 0), Number(draft.real || 0));
      const progress = Math.max(8, Math.min(100, Math.round((Number(draft.real || 0) / Math.max(1, Number(draft.plan || 1))) * 100)));
      return `
        <article class="rounded-[24px] border border-outline-variant bg-[linear-gradient(180deg,_#ffffff,_#f9fbff)] p-4 shadow-soft">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-2">
                <span class="rounded-full bg-[#edf2ff] px-2.5 py-1 text-body-sm font-semibold text-[#2f57d3]">${product.recetaId}</span>
                <span class="rounded-full ${yieldState.toneClass} px-2.5 py-1 text-body-sm font-semibold">${yieldState.label}</span>
              </div>
              <h3 class="mt-2 text-[20px] font-semibold tracking-[-0.03em] text-primary">${product.nombre}</h3>
              <p class="mt-1 text-body-sm text-on-surface-variant">${product.equipo} · tolerancia ±${product.toleranciaPct || 3}%</p>
            </div>
            <button class="rounded-full border border-[#dce4ff] bg-white px-3 py-2 text-body-sm font-semibold text-[#2f57d3]" data-focus-product="${product.id}" type="button">Ver control</button>
          </div>

          <div class="mt-4 grid gap-3 md:grid-cols-3">
            <label class="rounded-2xl bg-surface-container-low p-3">
              <span class="text-label-caps text-on-surface-variant">Plan</span>
              <input class="mt-1.5 w-full rounded-xl border border-outline-variant bg-white px-3 py-2 font-data-md text-primary" data-field="plan" data-product="${product.id}" min="0" type="number" value="${draft.plan}"/>
            </label>
            <label class="rounded-2xl bg-surface-container-low p-3">
              <span class="text-label-caps text-on-surface-variant">Real</span>
              <input class="mt-1.5 w-full rounded-xl border border-outline-variant bg-white px-3 py-2 font-data-md text-primary" data-field="real" data-product="${product.id}" min="0" type="number" value="${draft.real}"/>
            </label>

    function renderTurnsView(state, ingredientMap, todayTurns) {

      const activeProduct = state.productos.find((product) => product.id === (selectedOrder?.productoId || productionSession.activeProduct)) || state.productos[0];
      const activeDraft = productionDraft[activeProduct.id] || {

                      <div class="delta-track">
                        <div class="delta-fill ${yieldState.barClass}" style="width:${progress}%"></div>
                      </div>
                    </div>
                  </article>
                `;

                <div class="rounded-2xl border border-dashed border-outline-variant bg-surface-container-low px-4 py-10 text-center xl:col-span-2">

    function updateRecipeField(productId, field, value) {
      const current = recipeDrafts[productId];
      recipeDrafts = {
        ...recipeDrafts,
        [productId]: {
          ...current,
          [field]: Math.max(0, Number(value) || 0),
        },
      };
    }

    function updateRecipeIngredient(productId, insumoId, value) {
      const current = recipeDrafts[productId];
      recipeDrafts = {
        ...recipeDrafts,
        [productId]: {
          ...current,
          ingredientes: {
            ...current.ingredientes,
            [insumoId]: Math.max(0, Number(value) || 0),
          },
        },
      };
    }

    function saveRecipe(productId) {
      const state = productionApi.getState();
      const nextState = {
        ...state,
        productos: state.productos.map((product) => {
          if (product.id !== productId) {
            return product;
          }
          const draft = recipeDrafts[productId];
          return {
            ...product,
            rendimientoEsperado: Math.max(1, Number(draft.rendimiento) || product.rendimientoEsperado),
            toleranciaPct: Math.max(1, Number(draft.tolerancia) || product.toleranciaPct || 3),
            recetaInsumos: product.recetaInsumos.map((ingredient) => ({
              ...ingredient,
              cantidad: Math.max(0.1, Number(draft.ingredientes[ingredient.insumoId]) || ingredient.cantidad),
            })),
          };
        }),
      };

      productionApi.setState(nextState);
      const freshState = productionApi.getState();
      productionDraft = buildDraft(freshState);
      recipeDrafts = buildRecipeDrafts(freshState);
      productionApi.showToast("Receta activa actualizada.", "success");
      renderProduction();
    }

    function saveAllRecipes() {
      const state = productionApi.getState();
      const nextState = {
        ...state,
        productos: state.productos.map((product) => {
          const draft = recipeDrafts[product.id];
          return {
            ...product,
            rendimientoEsperado: Math.max(1, Number(draft.rendimiento) || product.rendimientoEsperado),
            toleranciaPct: Math.max(1, Number(draft.tolerancia) || product.toleranciaPct || 3),
            recetaInsumos: product.recetaInsumos.map((ingredient) => ({
              ...ingredient,
              cantidad: Math.max(0.1, Number(draft.ingredientes[ingredient.insumoId]) || ingredient.cantidad),
            })),
          };
        }),
      };
      productionApi.setState(nextState);
      const freshState = productionApi.getState();
      productionDraft = buildDraft(freshState);
      recipeDrafts = buildRecipeDrafts(freshState);
      productionApi.showToast("Todas las recetas quedaron guardadas.", "success");
      renderProduction();
    }

    function openRecipeFlow(product) {
      const ingredientMap = productionApi.getIngredientMap(productionApi.getState());
      productionApi.openModal({
        kicker: product.recetaId,
        title: `${product.nombre} · flujo de receta`,
        body: `
          <div class="space-y-4">
            <p class="text-body-md text-on-surface">Resumen de receta activa.</p>
            <div class="grid gap-3 md:grid-cols-5">
              ${[
                "Definir producto",
                "Asociar insumos",
                "Cantidades estándar",
                "Rendimiento esperado",
                "Guardar receta activa",
              ].map((step, index) => `
                <div class="rounded-2xl border border-outline-variant bg-surface-container-low p-4">
                  <p class="text-label-caps text-on-surface-variant">Paso ${index + 1}</p>
                  <p class="mt-2 text-body-md font-semibold text-primary">${step}</p>
                </div>
              `).join("")}
            </div>
            <div class="rounded-2xl border border-outline-variant bg-white p-4">
              <p class="text-label-caps text-on-surface-variant">Insumos de la regla</p>
              <div class="mt-3 space-y-2">
                ${product.recetaInsumos.map((ingredient) => `
                  <div class="flex items-center justify-between rounded-xl bg-surface-container-low px-3 py-2">
                    <span class="text-body-md text-on-surface">${productionApi.escapeHtml(ingredientMap[ingredient.insumoId].nombre)}</span>
                    <span class="font-data-md text-primary">${formatNumber(ingredient.cantidad, 1)} kg/lote</span>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>
        `,
        actions: [
          { id: "close-recipe-flow", label: "Cerrar" },
          {
            id: "save-recipe-from-flow",
            label: "Guardar receta activa",
            className: "rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-primary-container",
          },
        ],
      });
      document.getElementById("close-recipe-flow").addEventListener("click", productionApi.closeModal);
      document.getElementById("save-recipe-from-flow").addEventListener("click", () => {
        saveRecipe(product.id);
        productionApi.closeModal();
      });

    function syncDraftFromOrder(order) {
      if (!order) {
        return;
      }
      const current = productionDraft[order.productoId] || {
        plan: order.cantidadPlan,
        real: order.cantidadPlan,
        merma: Math.max(2, Math.round(order.cantidadPlan * 0.02)),
      };
      productionDraft[order.productoId] = {
        ...current,
        plan: order.cantidadPlan,
      };
    }

    function syncConsumptionDraftFromOrder(state, order) {
      if (!order) {
        return [];
      }
      if (!productionConsumptionDrafts[order.id]) {
        productionConsumptionDrafts[order.id] = buildConsumptionDraftForOrder(state, order);
      }
      return productionConsumptionDrafts[order.id];
    }

    function resetConsumptionDraft(order, state) {
      if (!order) {
        return;
      }
      productionConsumptionDrafts[order.id] = buildConsumptionDraftForOrder(state, order);
    }

    function updateConsumptionDraft(orderId, insumoId, value) {
      const current = productionConsumptionDrafts[orderId] || [];
      productionConsumptionDrafts[orderId] = current.map((item) =>
        item.insumoId === insumoId
          ? { ...item, cantidad: Math.max(0, Number(value) || 0) }
          : item,
      );
    }

    function createProductionOrder() {
      const state = productionApi.getState();
      const productId = productionSession.activeProduct;
      const draft = productionDraft[productId];
      const plan = Number(draft?.plan || 0);
      if (!productId || plan <= 0) {
        productionApi.showToast("Define producto y cantidad planificada antes de crear la orden.", "warn");
        return;
      }

      const beforeCount = state.ordenesProduccion.length;
      productionApi.crearOrdenProduccion({
        productoId: productId,
        cantidadPlan: plan,
        fecha: productionSession.date || productionApi.getToday(),
        turno: productionSession.shift || "Mañana",
        responsable: productionSession.manager || "Jefe de producción",
        equipo: productionSession.team || "Equipo principal",
        notas: productionSession.notes || "",
      });
      const nextState = productionApi.getState();
      if (nextState.ordenesProduccion.length === beforeCount) {
        productionApi.showToast("Ya existe una orden activa para este producto en ese turno.", "warn");
        return;
      }

      const createdOrder = [...nextState.ordenesProduccion]
        .reverse()
        .find((order) =>
          order.estado === "Activa" &&
          order.productoId === productId &&
          order.fecha === (productionSession.date || productionApi.getToday()) &&
          order.turno === (productionSession.shift || "Mañana"),
        );

      resetConsumptionDraft(createdOrder, nextState);
      productionSession = {
        ...productionSession,
        activeOrderId: createdOrder?.id || "",
      };
      syncDraftFromOrder(createdOrder);
      productionApi.showToast("Orden de producción creada.", "success");
      renderProduction();
    }

    function finalizeTurn() {
      const freshState = productionApi.getState();
      const activeOrder = freshState.ordenesProduccion.find((order) => order.id === productionSession.activeOrderId && order.estado === "Activa");
      if (!activeOrder) {
        productionApi.showToast("Primero crea o selecciona una orden activa para cerrar producción.", "warn");
        return;
      }

      const draft = productionDraft[activeOrder.productoId] || {};
      const consumptionDraft = (productionConsumptionDrafts[activeOrder.id] || [])
        .map((item) => ({
          insumoId: item.insumoId,
          cantidad: Number(item.cantidad || 0),
        }))
        .filter((item) => item.cantidad > 0);
      const entry = {
        orderId: activeOrder.id,
        productoId: activeOrder.productoId,
        cantidadPlan: Number(activeOrder.cantidadPlan || draft.plan || 0),
        cantidadReal: Number(draft.real || 0),
        merma: Number(draft.merma || 0),
        fecha: activeOrder.fecha || productionSession.date || productionApi.getToday(),
        turno: activeOrder.turno || productionSession.shift || "Mañana",
        responsable: activeOrder.responsable || productionSession.manager || "Jefe de producción",
        equipo: activeOrder.equipo || productionSession.team || "Equipo principal",
        consumoInsumos: consumptionDraft,
        notas: [
          `Orden: ${activeOrder.id}`,
          `Responsable: ${activeOrder.responsable || productionSession.manager || "Jefe de producción"}`,
          `Equipo: ${activeOrder.equipo || productionSession.team || "Equipo principal"}`,
          activeOrder.notas || productionSession.notes || "",
        ].filter(Boolean).join(" · "),
      };

      if (entry.cantidadReal <= 0) {
        productionApi.showToast("Registra producción real antes de cerrar la orden.", "warn");
        return;
      }

      const checks = productionApi.canFinalizeProductionEntries([entry], freshState);
      const missing = checks.filter((item) => !item.suficiente);

      if (missing.length) {
        const ingredientMap = productionApi.getIngredientMap(freshState);
        productionApi.openModal({
          kicker: "Inventario insuficiente",
          title: "No alcanza el stock para cerrar el turno",
          body: `
            <div class="space-y-3">
              <p class="text-body-md text-on-surface">Primero hay que resolver estos insumos para registrar el consumo real y la producción terminada.</p>
              ${missing.map((item) => `
                <div class="rounded-2xl bg-error-container p-4 text-on-error-container">
                  <p class="font-semibold">${productionApi.escapeHtml(ingredientMap[item.insumoId].nombre)}</p>
                  <p class="mt-1 text-body-sm">Se requieren ${formatNumber(item.cantidad, 1)} kg y solo hay ${formatNumber(item.disponible, 1)} kg disponibles.</p>
                </div>
              `).join("")}
            </div>
          `,
          actions: [{ id: "close-turn-missing", label: "Entendido" }],
        });
        document.getElementById("close-turn-missing").addEventListener("click", productionApi.closeModal);
        return;
      }

      productionApi.registrarProduccionBatch([entry]);
      const updatedState = productionApi.getState();
      productionDraft = buildDraft(updatedState);
      recipeDrafts = buildRecipeDrafts(updatedState);
      productionSession = {
        ...productionSession,
        notes: "",
        activeOrderId: "",
      };

      const totalOutput = Math.max(0, entry.cantidadReal - entry.merma);
      productionApi.openModal({
        kicker: "Turno guardado",
        title: "Producción cerrada y stock terminado actualizado",
        body: `
          <div class="space-y-4">
            <div class="rounded-2xl bg-surface-container-low p-4">
              <p class="text-label-caps text-on-surface-variant">Resumen del cierre</p>
              <p class="mt-2 text-headline-md text-primary">${productionSession.shift} · ${productionSession.date}</p>
              <p class="mt-2 text-body-md text-on-surface-variant">${formatNumber(totalOutput)} unidades dadas de alta.</p>
            </div>
            <div class="grid gap-3 md:grid-cols-3">
              <div class="rounded-2xl border border-outline-variant p-4">
                <p class="text-label-caps text-on-surface-variant">Orden</p>
                <p class="mt-2 font-data-md text-primary">${activeOrder.id}</p>
              </div>
              <div class="rounded-2xl border border-outline-variant p-4">
                <p class="text-label-caps text-on-surface-variant">Merma</p>
                <p class="mt-2 font-data-md text-primary">${formatNumber(entry.merma)} u</p>
              </div>
              <div class="rounded-2xl border border-outline-variant p-4">
                <p class="text-label-caps text-on-surface-variant">Estado</p>
                <p class="mt-2 font-data-md text-primary">Listo para asignar</p>
              </div>
            </div>
          </div>
        `,
        actions: [
          { id: "close-turn-success", label: "Seguir en producción" },
          {
            id: "go-finished-stock",
            label: "Ver producto terminado",
            className: "rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-primary-container",
          },
        ],
      });
      document.getElementById("close-turn-success").addEventListener("click", () => {
        productionApi.closeModal();
        renderProduction();
      });
      document.getElementById("go-finished-stock").addEventListener("click", () => {
        productionApi.closeModal();
        syncProductionSubviewUrl("finished");
        renderProduction();
      });
    }

    function bindProductionEvents(state, activeSubview) {
      document.getElementById("production-refresh").addEventListener("click", renderProduction);
      document.getElementById("production-dashboard").addEventListener("click", () => {
        window.location.href = "index.html";
      });

      const primaryAction = document.getElementById("production-primary-action");
      if (primaryAction) {
        primaryAction.addEventListener("click", () => {
          if (activeSubview.id === "recipes") {
            saveAllRecipes();
            return;
          }
          if (activeSubview.id === "finished") {
            window.location.href = "distribution.html";
            return;
          }
          finalizeTurn();
        });
      }

      document.querySelectorAll("[data-field]").forEach((input) => {
        input.addEventListener("change", (event) => {
          const { product, field } = event.target.dataset;
          productionDraft[product][field] = event.target.value;
          renderProduction();
        });
      });

      document.querySelectorAll("[data-session-field]").forEach((input) => {
        input.addEventListener("change", (event) => {
          const field = event.target.dataset.sessionField;
          productionSession = {
            ...productionSession,
            [field]: event.target.value,
          };
          if (["activeProduct", "date", "shift"].includes(field)) {
            productionSession.activeOrderId = "";
          }
          if (field === "activeProduct" || field === "date" || field === "shift") {
            renderProduction();
          }
        });
      });

      document.querySelectorAll("[data-focus-product]").forEach((button) => {
        button.addEventListener("click", () => {
          productionSession = {
            ...productionSession,
            activeProduct: button.dataset.focusProduct,
            activeOrderId: "",
          };
          syncProductionSubviewUrl("turns");
          renderProduction();
        });
      });

      document.querySelectorAll("[data-focus-order]").forEach((button) => {
        button.addEventListener("click", () => {
          productionSession = {
            ...productionSession,
            activeOrderId: button.dataset.focusOrder,
            activeProduct: button.dataset.focusProduct,
          };
          renderProduction();
        });
      });

      document.querySelectorAll("[data-consumption-order]").forEach((input) => {
        input.addEventListener("change", (event) => {
          const orderId = event.target.dataset.consumptionOrder;
          const insumoId = event.target.dataset.consumptionInsumo;
          updateConsumptionDraft(orderId, insumoId, event.target.value);
          renderProduction();
        });
      });

      document.querySelectorAll("[data-recipe-field]").forEach((input) => {
        input.addEventListener("change", (event) => {
          updateRecipeField(event.target.dataset.product, event.target.dataset.recipeField, event.target.value);
          renderProduction();
        });
      });

      document.querySelectorAll("[data-recipe-ingredient]").forEach((input) => {
        input.addEventListener("change", (event) => {
          updateRecipeIngredient(event.target.dataset.product, event.target.dataset.recipeIngredient, event.target.value);
          renderProduction();
        });
      });

      document.querySelectorAll("[data-save-recipe]").forEach((button) => {
        button.addEventListener("click", () => {
          saveRecipe(button.dataset.saveRecipe);
        });
      });

      document.querySelectorAll("[data-open-recipe-modal]").forEach((button) => {
        button.addEventListener("click", () => {
          const product = state.productos.find((item) => item.id === button.dataset.openRecipeModal);
          if (product) {
            openRecipeFlow(product);
          }
        });
      });

      const finishTurnButton = document.getElementById("production-finish-turn");
      if (finishTurnButton) {
        finishTurnButton.addEventListener("click", finalizeTurn);
      }

      const createOrderButton = document.getElementById("production-create-order");
      if (createOrderButton) {
        createOrderButton.addEventListener("click", createProductionOrder);
      }

      const resetConsumptionButton = document.getElementById("production-reset-consumption");
      if (resetConsumptionButton) {
        resetConsumptionButton.addEventListener("click", () => {
          const selectedOrder = state.ordenesProduccion.find((order) => order.id === productionSession.activeOrderId);
          if (!selectedOrder) {
            productionApi.showToast("Selecciona una orden activa para recalcular consumo.", "warn");
            return;
          }
          resetConsumptionDraft(selectedOrder, state);
          productionApi.showToast("Consumo teórico recargado desde la receta.", "info");
          renderProduction();
        });
      }

      const goDistributionDirect = document.getElementById("go-distribution-direct");
      if (goDistributionDirect) {
        goDistributionDirect.addEventListener("click", () => {
          window.location.href = "distribution.html";
        });
      }
    }

    function renderProduction() {
      const state = productionApi.getState();
      const metrics = productionApi.buildMetrics(state);
      const ingredientMap = productionApi.getIngredientMap(state);
      ensureDraft(state);
      ensureRecipeDrafts(state);
      ensureConsumptionDrafts(state);
      ensureSessionDraft(state);

      const activeSubview = getSubviewMeta();
      const todayTurns = state.turnos.filter((turn) => turn.fecha === (productionSession.date || productionApi.getToday()));
      const finishedRows = buildFinishedRows(state);
      const recipeReadyCount = state.productos.filter((product) => product.recetaInsumos.length > 0).length;
      const toleranceAlerts = state.turnos.filter((turn) => {
        const product = state.productos.find((item) => item.id === turn.productoId);
        return Math.abs(turn.desviacionPct) > Number(product?.toleranciaPct || 3);
      });
      const totalTodayWaste = todayTurns.reduce((sum, turn) => sum + turn.merma, 0);
      const totalTodayOutput = todayTurns.reduce((sum, turn) => sum + Math.max(0, turn.cantidadReal - turn.merma), 0);

      const sidebarSubmenuItems = [
        { id: "recipes", href: "production.html?subview=recipes", label: "Recetas", helper: "Fórmula", icon: "menu_book" },
        { id: "turns", href: "production.html?subview=turns", label: "Turnos", helper: "Lote vivo", icon: "schedule" },
        { id: "finished", href: "production.html?subview=finished", label: "Terminados", helper: "Salida", icon: "inventory" },
      ];

      productionApi.mountShell({
        activePage: "production",
        title: "Producción",
        sidebarSubmenu: {
          parentPage: "production",
          activeId: activeSubview.id,
          items: sidebarSubmenuItems,
        },
        header: {
          eyebrow: "PANADATOR · PRODUCCIÓN",
          badge: activeSubview.label,
          badgeIcon: "bakery_dining",
          secondaryActions: [
            { id: "production-refresh", icon: "autorenew", label: "Refrescar" },
            { id: "production-dashboard", icon: "dashboard", label: "Dashboard" },
          ],
          primaryAction: { id: "production-primary-action", icon: activeSubview.primaryIcon, label: activeSubview.primaryLabel },
        },
      });

      const root = document.getElementById("production-root");
      root.innerHTML = `
        <section class="grid h-full min-h-0 gap-4 xl:grid-cols-[272px_minmax(0,1fr)]">
          <aside class="flex min-h-0 flex-col rounded-[24px] border border-[#ead7b2] bg-[radial-gradient(circle_at_top_left,_rgba(255,215,153,0.38),_transparent_24%),radial-gradient(circle_at_bottom_left,_rgba(255,244,221,0.9),_transparent_38%),linear-gradient(180deg,_#fffdfa,_#fff5e4)] p-3.5 shadow-[0_16px_36px_rgba(140,96,31,0.12)]">
            <div>
              <p class="inline-flex items-center gap-2 rounded-full border border-[#ffd489] bg-[#fff5df] px-3 py-1 text-body-sm font-medium text-[#b46b00]">
                <span class="material-symbols-outlined text-[18px]">bakery_dining</span>
                Panadator
              </p>
              <h1 class="mt-2.5 text-[22px] font-bold leading-[1.02] tracking-[-0.04em] text-primary">${activeSubview.label}</h1>
              <p class="mt-1.5 text-[11px] leading-4 text-[#8f775c]">Suite panadera.</p>
            </div>

            <div class="mt-3 grid gap-2">
              ${summaryCard("menu_book", "Recetas activas", `${recipeReadyCount}/${state.productos.length}`, "productos con receta estándar", "soft")}
              ${summaryCard("schedule", "Turnos del día", `${todayTurns.length}`, "cierres en la fecha operativa", "default")}
              ${summaryCard("straighten", "Producción del día", `${formatNumber(totalTodayOutput)} u`, "dadas de alta", "warm")}
              ${summaryCard("delete", "Merma del día", `${formatNumber(totalTodayWaste)} u`, "impacto del turno", "alert")}
              ${summaryCard("inventory", "Terminados", `${formatNumber(metrics.availableUnits)} u`, "listos para salida", "soft")}
              ${summaryCard("warning", "Desvíos", `${toleranceAlerts.length}`, toleranceAlerts.length ? "sobre tolerancia" : "sin alertas críticas", toleranceAlerts.length ? "alert" : "default")}
            </div>

            <section class="mt-3 rounded-[22px] bg-[linear-gradient(180deg,#6d4627,#4f311c)] p-3.5 text-white shadow-[0_18px_36px_rgba(79,49,28,0.24)]">
              <div class="flex items-center justify-between gap-4">
                <div>
                  <p class="text-label-caps text-[#d8c1a6]">Pulso del horno</p>
                  <h3 class="mt-1 text-[18px] font-semibold tracking-[-0.03em]">Resumen</h3>
                </div>
                <span class="rounded-full bg-white/10 px-3 py-1 text-body-sm">${metrics.productionAccuracy}% ritmo</span>
              </div>
              <div class="mt-3 space-y-2">
                ${[
                  { label: "Rendimiento esperado", value: `${metrics.productionAccuracy}%`, pct: metrics.productionAccuracy, bar: "bg-on-tertiary-container" },
                  { label: "Conciliación stock", value: `${metrics.conciliationPct}%`, pct: metrics.conciliationPct, bar: "bg-secondary" },
                  { label: "SLA operativo", value: `${state.slaCumplimiento}%`, pct: state.slaCumplimiento, bar: "bg-[#ffb72b]" },
                ].map((item) => `
                  <div class="rounded-2xl bg-white/10 p-2.5">
                    <div class="flex items-center justify-between gap-3">
                      <span class="text-body-sm text-[#e8d8c5]">${item.label}</span>
                      <span class="font-data-md text-white">${item.value}</span>
                    </div>
                    <div class="mt-2 delta-track bg-white/10">
                      <div class="delta-fill ${item.bar}" style="width:${Math.max(8, item.pct)}%"></div>
                    </div>
                  </div>
                `).join("")}
              </div>
            </section>

            <section class="mt-3 rounded-[22px] border border-[#ead7b2] bg-[linear-gradient(180deg,_#fffdfa,_#fff8ee)] p-3.5 shadow-soft">
              <p class="text-label-caps text-[#8f775c]">Flujo base</p>
              <div class="mt-2.5 space-y-2">
                ${[
                  "Definir receta",
                  "Crear orden de turno",
                  "Registrar consumo real",
                  "Dar de alta producto terminado",
                ].map((step, index) => `
                  <div class="flex items-center gap-3 rounded-2xl bg-[#fff4df] px-3 py-2.5">
                    <span class="flex h-8 w-8 items-center justify-center rounded-full bg-white font-data-md text-[#b46b00]">${index + 1}</span>
                    <span class="text-body-sm text-on-surface">${step}</span>
                  </div>
                `).join("")}
              </div>
            </section>
          </aside>

          <section class="flex min-h-0 flex-col overflow-hidden rounded-[28px] border border-[#ead7b2] bg-[linear-gradient(180deg,_#ffffff,_#fffdfa)] p-4 shadow-soft">
            <div class="border-b border-outline-variant pb-3">
              <div class="flex flex-col gap-3 xl:flex-row xl:items-end xl:justify-between">
                <div>
                  <p class="text-label-caps text-on-surface-variant">${activeSubview.eyebrow}</p>
                  <h2 class="mt-1.5 text-[28px] font-semibold tracking-[-0.04em] text-primary">${activeSubview.title}</h2>
                  <p class="mt-1 max-w-3xl text-body-sm text-on-surface-variant">${activeSubview.subtitle}</p>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                  <span class="rounded-full bg-surface-container-low px-3 py-2 text-body-sm font-semibold text-on-surface-variant">${state.productos.length} productos</span>
                  <span class="rounded-full bg-[#edf2ff] px-3 py-2 text-body-sm font-semibold text-[#2f57d3]">${todayTurns.length} turnos visibles</span>
                </div>
              </div>
            </div>

            <div class="mt-4 min-h-0 flex-1 overflow-y-auto pr-1">
              ${activeSubview.id === "recipes"
                ? renderRecipesView(state, ingredientMap)
                : activeSubview.id === "finished"
                  ? renderFinishedView(state, finishedRows, metrics)
                  : renderTurnsView(state, ingredientMap, todayTurns)}
            </div>
          </section>
        </section>
      `;

      bindProductionEvents(state, activeSubview);
    }

    window.addEventListener("focus", renderProduction);
    window.addEventListener("storage", renderProduction);
    renderProduction();
  </script>
</body>
</html>
