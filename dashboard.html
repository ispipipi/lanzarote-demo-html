    body { font-family: "Inter", sans-serif; }

      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;

</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_top,_rgba(213,227,253,0.45),_transparent_28%),linear-gradient(180deg,_#f7f9fb,_#eef2f6)] text-on-surface antialiased md:flex">
  <aside class="px-3 pt-3 md:h-screen md:w-[360px] md:shrink-0 md:p-6" id="sidebar"></aside>
  <main class="min-w-0 flex-1">
    <header class="sticky top-0 z-30 border-b border-outline-variant/80 bg-[rgba(247,249,251,0.82)] px-4 py-4 backdrop-blur-xl sm:px-6 md:min-h-[88px] md:px-container-padding" id="topbar"></header>
    <div class="mx-auto max-w-[1440px] space-y-stack-lg px-4 pb-6 pt-6 sm:px-6 md:p-container-padding md:pt-8" id="audit-root"></div>
  </main>
  <script src="state.js?v=20260709-ui6"></script>
  <script>
    const auditApi = window.LanzaroteState;
    const auditParams = new URLSearchParams(window.location.search);
    const auditFocus = auditParams.get("focus") || "";
    let auditFilter = auditFocus === "closures" ? "alerta" : "all";

    function buildTimeline(state) {
      const productMap = auditApi.getProductMap(state);
      const ingredientMap = auditApi.getIngredientMap(state);
      const customerMap = auditApi.getCustomerMap(state);
      const entries = [];

      state.comprasInsumos.forEach((purchase) => {
        entries.push({
          id: purchase.id,
          tipo: "insumos",
          fecha: purchase.fecha,
          titulo: `${ingredientMap[purchase.insumoId].nombre} comprado`,
          detalle: `${purchase.proveedor} · ${purchase.cantidad.toFixed(1)} ${ingredientMap[purchase.insumoId].unidad}`,
        });
      });

      state.turnos.forEach((turn) => {
        entries.push({
          id: turn.id,
          tipo: "producción",
          fecha: turn.fecha,
          titulo: `${productMap[turn.productoId].nombre} registrado`,
          detalle: `${turn.turno} · Real ${turn.cantidadReal} u · Merma ${turn.merma} u`,
        });
      });

      state.pedidosDelivery.forEach((order) => {
        entries.push({
          id: order.id,
          tipo: "delivery",
          fecha: String(order.createdAt).slice(0, 10),
          titulo: `${order.cliente} en ruta ${order.ruta}`,
          detalle: `${productMap[order.productoId].nombre} · ${order.estado} · ${order.chofer}`,
        });
      });

      state.ventas.forEach((sale) => {
        entries.push({
          id: sale.id,
          tipo: "venta",
          fecha: String(sale.timestamp).slice(0, 10),
          titulo: `${productMap[sale.productoId].nombre} vendido`,
          detalle: `${auditApi.formatCurrency(sale.monto)} · ${sale.clienteComercialId ? customerMap[sale.clienteComercialId].nombre : state.canales.find((item) => item.id === sale.canalId).nombre}`,
        });
      });

      state.devoluciones.forEach((refund) => {
        entries.push({
          id: refund.id,
          tipo: "devolución",
          fecha: refund.fecha,
          titulo: `${productMap[refund.productoId].nombre} devuelto`,
          detalle: `${refund.cantidad} unidades · ${refund.motivo}`,
        });
      });

      state.alertas.forEach((alert) => {
        entries.push({
          id: alert.id,
          tipo: "alerta",
          fecha: String(alert.timestamp).slice(0, 10),
          titulo: alert.tipo,
          detalle: alert.mensaje,
        });
      });

      return entries.sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
    }

    function renderAudit() {
      const state = auditApi.getState();
      const metrics = auditApi.buildMetrics(state);
      const timeline = buildTimeline(state).filter((entry) => auditFilter === "all" || entry.tipo === auditFilter);
      const pendingLoadOrders = state.pedidosDelivery.filter((item) => !item.cargaCerrada);
      const daysWithoutTurnClose = state.turnos.some((turn) => turn.fecha === auditApi.DEMO_DATE) ? 0 : 1;

      auditApi.mountShell({
        activePage: "",
        allowPageScroll: true,
        title: "Audit Trail",
        header: {
          eyebrow: "AUDIT TRAIL",
          badge: `${timeline.length} eventos visibles`,
          badgeIcon: "query_stats",
          secondaryActions: [
            { id: "audit-refresh", icon: "autorenew", label: "Refrescar" },
            { id: "audit-home", icon: "dashboard", label: "Dashboard" },
          ],
          primaryAction: { id: "audit-reset-filter", icon: "filter_alt_off", label: "Limpiar filtro" },
        },
      });

      const root = document.getElementById("audit-root");
      root.innerHTML = `
        ${auditFocus === "closures" ? `
          <section class="rounded-xl border border-[#ffe0a0] bg-[linear-gradient(180deg,_#fff8ea,_#ffffff)] p-5 shadow-soft">
            <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
              <div>
                <p class="text-label-caps text-[#9c6400]">Detalle desde dashboard</p>
                <h2 class="mt-2 text-headline-md text-primary">Cierres pendientes</h2>
                <p class="mt-2 text-body-sm text-on-surface-variant">Cajas, rutas y días que todavía no quedan cerrados operativamente.</p>
              </div>
              <a class="inline-flex items-center gap-2 rounded-full border border-[#ffe0a0] bg-white px-4 py-2 text-body-sm font-semibold text-[#7a4f00]" href="index.html">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                Volver al dashboard
              </a>
            </div>
            <div class="mt-4 grid gap-3 md:grid-cols-3">
              ${metricCard("Asignaciones abiertas", String(state.asignacionesPendientes.length), "sin confirmar")}
              ${metricCard("Rutas sin cierre", String(pendingLoadOrders.length), "carga pendiente")}
              ${metricCard("Días sin cierre", String(daysWithoutTurnClose), "jornada sin registro final")}
            </div>
          </section>
        ` : ""}

        <section class="grid gap-gutter md:grid-cols-2 xl:grid-cols-4">
          ${metricCard("Eventos", String(timeline.length), `filtro ${auditFilter}`)}
          ${metricCard("Producción auditada", String(state.turnos.length), `${metrics.totalProduced.toLocaleString("es-CL")} u netas`)}
          ${metricCard("Ventas auditadas", String(state.ventas.length), metrics.formattedSoldAmount)}
          ${metricCard("SLA vigente", `${state.slaCumplimiento}%`, metrics.statusLabel)}
        </section>

        <section class="rounded-xl border border-outline-variant bg-white p-6 shadow-soft">
          <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div>
              <p class="text-label-caps text-on-surface-variant">Filtros</p>
              <h2 class="mt-2 text-headline-md text-primary">Timeline</h2>
            </div>
            <div class="flex flex-wrap gap-2">
              ${["all", "insumos", "producción", "delivery", "venta", "devolución", "alerta"].map((filter) => `
                <button class="audit-filter rounded-full px-4 py-2 text-body-sm font-semibold ${auditFilter === filter ? "bg-primary text-white" : "bg-surface-container-low text-on-surface-variant"}" data-filter="${filter}" type="button">
                  ${filter}
                </button>
              `).join("")}
            </div>
          </div>

          <div class="mt-6 space-y-3">
            ${timeline.map((entry) => `
              <article class="rounded-xl border border-outline-variant bg-surface-container-low p-4">
                <div class="flex flex-col gap-2 md:flex-row md:items-start md:justify-between">
                  <div>
                    <p class="text-label-caps text-on-surface-variant">${entry.tipo}</p>
                    <h3 class="mt-2 text-body-md font-semibold text-primary">${auditApi.escapeHtml(entry.titulo)}</h3>
                    <p class="mt-2 text-body-md text-on-surface-variant">${auditApi.escapeHtml(entry.detalle)}</p>
                  </div>
                  <span class="font-data-md text-primary">${entry.fecha}</span>
                </div>
              </article>
            `).join("") || '<p class="rounded-xl bg-surface-container-low p-4 text-body-md text-on-surface-variant">Sin eventos.</p>'}
          </div>
        </section>
      `;

      document.getElementById("audit-refresh").addEventListener("click", renderAudit);
      document.getElementById("audit-home").addEventListener("click", () => {
        window.location.href = "index.html";
      });
      document.getElementById("audit-reset-filter").addEventListener("click", () => {
        auditFilter = "all";
        renderAudit();
      });
      document.querySelectorAll(".audit-filter").forEach((button) => {
        button.addEventListener("click", (event) => {
          auditFilter = event.currentTarget.dataset.filter;
          renderAudit();
        });
      });
    }

    function metricCard(label, value, helper) {
      return `
        <article class="rounded-xl border border-outline-variant bg-white p-5 shadow-soft">
          <p class="text-label-caps text-on-surface-variant">${label}</p>
          <p class="mt-3 font-data-lg text-primary">${value}</p>
          <p class="mt-2 text-body-sm text-on-surface-variant">${helper}</p>
        </article>
      `;
    }

    window.addEventListener("focus", renderAudit);
    window.addEventListener("storage", renderAudit);
    renderAudit();
  </script>
</body>
</html>
