  <style>
    body { font-family: "Inter", sans-serif; }
    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      vertical-align: middle;
    }
    .sii-demo-player {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      border: 1px solid rgba(191, 211, 255, 0.28);
      background:
        radial-gradient(circle at top right, rgba(92, 123, 255, 0.22), transparent 28%),
        linear-gradient(180deg, #13213d 0%, #15284b 48%, #1e3564 100%);
      box-shadow: 0 24px 54px rgba(19, 33, 61, 0.24);
    }
    .sii-demo-player::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.06) 48%, transparent 100%);
      background-size: 100% 18px;
      opacity: 0.35;
      animation: siiScan 4.2s linear infinite;
      pointer-events: none;
    }
    .sii-orbit {
      position: absolute;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.18);
      animation: siiPulse 3.6s ease-in-out infinite;
    }
    .sii-progress-fill {
      background: linear-gradient(90deg, #ffb72b 0%, #7fb3ff 62%, #ffffff 100%);
      background-size: 200% 100%;
      animation: siiProgress 3.4s linear infinite;
    }
    .sii-log-row {
      opacity: 0;
      transform: translateY(6px);
      animation: siiLog 4.6s ease-in-out infinite;
    }
    .sii-log-row.delay-1 { animation-delay: 0.5s; }
    .sii-log-row.delay-2 { animation-delay: 1s; }
    .sii-log-row.delay-3 { animation-delay: 1.5s; }
    @keyframes siiScan {
      0% { transform: translateY(-20%); }
      100% { transform: translateY(120%); }
    }
    @keyframes siiPulse {
      0%, 100% { transform: scale(0.96); opacity: 0.55; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    @keyframes siiProgress {
      0% { width: 18%; background-position: 0% 50%; }
      50% { width: 72%; background-position: 50% 50%; }
      100% { width: 96%; background-position: 100% 50%; }
    }
    @keyframes siiLog {
      0%, 12% { opacity: 0; transform: translateY(6px); }
      18%, 78% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-2px); }
    }
  </style>
</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_top,_rgba(213,227,253,0.45),_transparent_28%),linear-gradient(180deg,_#f7f9fb,_#eef2f6)] text-on-surface antialiased md:flex">
  <aside class="px-3 pt-3 md:h-screen md:w-[360px] md:shrink-0 md:p-6" id="sidebar"></aside>
  <main class="min-w-0 flex-1">
    <header class="sticky top-0 z-30 border-b border-outline-variant/80 bg-[rgba(247,249,251,0.82)] px-4 py-4 backdrop-blur-xl sm:px-6 md:min-h-[88px] md:px-container-padding" id="topbar"></header>
    <div class="mx-auto flex h-full w-full max-w-none min-h-0 flex-col px-4 pb-4 pt-4 sm:px-6 sm:pt-5 md:p-container-padding md:pt-5" id="insumos-root"></div>
  </main>
  <script src="state.js?v=20260709-ui6"></script>
  <script>
    const insumosApi = window.LanzaroteState;
    const inventorySearchParams = new URLSearchParams(window.location.search);
    let purchaseFilter = "";
    let purchasePage = 0;
    let siiCursor = 0;
    let inventorySubview = inventorySearchParams.get("subview") || "purchase";
    let siiSyncTimers = [];
    const pageSize = 4;
    const suppliers = ["Molinos del Sur S.A.", "Distribuidora Central", "Importaciones Bio"];
    const siiSyncBatches = [
      {
        periodo: "Julio 2026",
        empresa: "Panadator",
        rut: "76.458.210-4",
        sucursal: "Casa Matriz",
        documentos: [
          {
            proveedor: "Molinos del Sur S.A.",
            fecha: "2026-07-08",
            documento: "FAC-10844",
            folio: "10844",
            items: [
              { insumoId: "harina", cantidad: 180, precioUnitario: 930 },
              { insumoId: "levadura", cantidad: 6, precioUnitario: 5650 },
            ],
          },
          {
            proveedor: "Distribuidora Central",
            fecha: "2026-07-08",
            documento: "FAC-22101",
            folio: "22101",
            items: [
              { insumoId: "azucar", cantidad: 32, precioUnitario: 1200 },
              { insumoId: "sal", cantidad: 10, precioUnitario: 640 },
            ],
          },
        ],
      },
      {
        periodo: "Julio 2026",
        empresa: "Panadator",
        rut: "76.458.210-4",
        sucursal: "Bodega Central",
        documentos: [
          {
            proveedor: "Importaciones Bio",
            fecha: "2026-07-08",
            documento: "FAC-88214",
            folio: "88214",
            items: [
              { insumoId: "levadura", cantidad: 9, precioUnitario: 5580 },
            ],
          },
          {
            proveedor: "Distribuidora Central",
            fecha: "2026-07-07",
            documento: "FAC-22088",
            folio: "22088",
            items: [
              { insumoId: "sal", cantidad: 16, precioUnitario: 630 },
            ],
          },
        ],
      },
    ];

    function getIngredientVisual(id) {
      const visuals = {
        harina: { icon: "grain", accent: "bg-[#fff1d6] text-[#9a6503]" },
        levadura: { icon: "bakery_dining", accent: "bg-[#eef3ff] text-[#2341ae]" },
        azucar: { icon: "cookie", accent: "bg-[#ffe6ef] text-[#b14b76]" },
        sal: { icon: "nutrition", accent: "bg-[#e8f4ff] text-[#18618f]" },
      };
      return visuals[id] || { icon: "inventory_2", accent: "bg-[#eef3ff] text-[#3556c5]" };
    }

    function getInventoryHealth(criticalCount, warningCount, averageCoverage) {
      if (criticalCount > 0) {
        return {
          title: "Atención inmediata",
          summary: `${criticalCount} insumos están bajo el umbral crítico.`,
          chip: "Crítico",
          chipClass: "bg-[#ffe0db] text-[#a63c31]",
          cardClass: "border-[#ffd8d2] bg-[linear-gradient(180deg,_#fff8f6,_#fff1ec)]",
          iconWrapClass: "bg-[#ffe0db] text-[#d14b3f]",
          icon: "emergency_home",
        };
      }
      if (warningCount > 0 || averageCoverage < 60) {
        return {
          title: "Reposición durante el turno",
          summary: `${warningCount} insumos conviene reponer antes del próximo lote.`,
          chip: "Reposición",
          chipClass: "bg-[#edf2ff] text-[#2341ae]",
          cardClass: "border-[#dce4ff] bg-[linear-gradient(180deg,_#ffffff,_#f5f8ff)]",
          iconWrapClass: "bg-[#edf2ff] text-[#3556c5]",
          icon: "inventory_2",
        };
      }
      return {
        title: "Inventario controlado",
        summary: "La bodega tiene cobertura sana para seguir produciendo.",
        chip: "Óptimo",
        chipClass: "bg-[#e4f5ea] text-[#1f7a46]",
        cardClass: "border-[#d8f0df] bg-[linear-gradient(180deg,_#fbfffc,_#f2fbf5)]",
        iconWrapClass: "bg-[#e7f6eb] text-[#1f7a46]",
        icon: "verified",
      };
    }

    function syncInventorySubviewUrl(nextSubview) {
      const url = new URL(window.location.href);
      url.searchParams.set("subview", nextSubview);
      window.history.replaceState({}, "", `${url.pathname}${url.search}${url.hash}`);
    }

    function focusPurchaseForm() {
      if (inventorySubview !== "purchase") {
        inventorySubview = "purchase";
        syncInventorySubviewUrl("purchase");
        renderInsumos();
      }
      const panel = document.getElementById("purchase-panel");
      if (panel) {
        panel.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      window.setTimeout(() => {
        document.getElementById("purchase-quantity")?.focus();
      }, 180);
    }

    function clearSiiSyncTimers() {
      siiSyncTimers.forEach((timer) => window.clearTimeout(timer));
      siiSyncTimers = [];
    }

    function openReceptionDifferenceModal(receipt, ingredientMap) {
      const ingredient = ingredientMap[receipt.insumoId];
      insumosApi.openModal({
        kicker: receipt.documento || "Recepción física",
        title: `${ingredient?.nombre || receipt.insumoId} · recepción con diferencia`,
        body: `
          <div class="space-y-4">
            <div class="rounded-2xl bg-surface-container-low p-4">
              <p class="text-label-caps text-on-surface-variant">Compra registrada</p>
              <p class="mt-2 text-body-md font-semibold text-primary">${insumosApi.escapeHtml(receipt.proveedor)}</p>
              <p class="mt-2 text-body-sm text-on-surface-variant">Solicitado: ${receipt.cantidadSolicitada.toFixed(1)} ${ingredient?.unidad || "kg"} · ${insumosApi.formatCurrency(receipt.totalSolicitado || 0)}</p>
            </div>
            <label class="block rounded-2xl border border-outline-variant bg-white p-4">
              <span class="text-label-caps text-on-surface-variant">Cantidad recibida</span>
              <input class="mt-2 w-full rounded-xl border border-outline-variant bg-surface-container-low px-3 py-2 font-data-md text-primary" id="receipt-diff-qty" max="${receipt.cantidadSolicitada}" min="0" step="0.1" type="number" value="${receipt.cantidadSolicitada > 0 ? Math.max(0, receipt.cantidadSolicitada - 1).toFixed(1) : "0.0"}"/>
            </label>
            <label class="block rounded-2xl border border-outline-variant bg-white p-4">
              <span class="text-label-caps text-on-surface-variant">Evidencia o diferencia</span>
              <textarea class="mt-2 h-24 w-full resize-none rounded-xl border border-outline-variant bg-surface-container-low px-3 py-2 text-body-md text-primary" id="receipt-diff-evidence" placeholder="Ej. faltaron 4 kg, saco roto, folio con diferencia de despacho."></textarea>
            </label>
            <label class="block rounded-2xl border border-outline-variant bg-white p-4">
              <span class="text-label-caps text-on-surface-variant">Observación interna</span>
              <textarea class="mt-2 h-20 w-full resize-none rounded-xl border border-outline-variant bg-surface-container-low px-3 py-2 text-body-md text-primary" id="receipt-diff-note" placeholder="Comentario para compras o bodega."></textarea>
            </label>
          </div>
        `,
        actions: [
          { id: "receipt-diff-cancel", label: "Cancelar" },
          {
            id: "receipt-diff-save",
            label: "Guardar recepción",
            className: "rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-primary-container",
          },
        ],
      });

      document.getElementById("receipt-diff-cancel").addEventListener("click", insumosApi.closeModal);
      document.getElementById("receipt-diff-save").addEventListener("click", () => {
        const requested = Number(receipt.cantidadSolicitada || 0);
        const received = Number(document.getElementById("receipt-diff-qty").value || 0);
        const evidence = document.getElementById("receipt-diff-evidence").value.trim();
        const note = document.getElementById("receipt-diff-note").value.trim();

        if (received < 0 || received >= requested) {
          insumosApi.showToast("Para usar esta opción, la recepción debe quedar por debajo de lo solicitado.", "warn");
          return;
        }
        if (!evidence) {
          insumosApi.showToast("Agrega la evidencia o la diferencia observada antes de guardar.", "warn");
          return;
        }

        insumosApi.registrarRecepcionInsumo({
          id: receipt.id,
          recepcionEstado: "Con diferencia",
          cantidadRecibida: received,
          evidencia: evidence,
          observacion: note,
        });
        insumosApi.closeModal();
        insumosApi.showToast("Recepción validada con diferencia y stock actualizado por lo recibido.", "success");
        renderInsumos();
      });
    }

    function openSiiSyncModal(state, ingredientMap) {
      const batch = siiSyncBatches[siiCursor % siiSyncBatches.length];
      siiCursor += 1;
      const totalDocs = batch.documentos.length;
      const totalLines = batch.documentos.reduce((sum, document) => sum + document.items.length, 0);
      const totalAmount = batch.documentos.reduce(
        (sum, document) => sum + document.items.reduce((docSum, item) => docSum + (item.cantidad * item.precioUnitario), 0),
        0,
      );
      clearSiiSyncTimers();
      const importDocuments = batch.documentos.map((document, index) => ({
        ...document,
        index,
        total: document.items.reduce((sum, item) => sum + (item.cantidad * item.precioUnitario), 0),
      }));
      let importedDocs = 0;
      let importedAmount = 0;
      let syncFinished = false;

      insumosApi.openModal({
        kicker: "Sincronización SII",
        title: "Sincronización automática desde SII",
        body: `
          <div class="space-y-4">
            <section class="sii-demo-player p-4 text-white">
              <div class="relative z-10">
                <div class="flex items-center justify-between gap-4">
                  <div class="flex items-center gap-3">
                    <div class="relative flex h-12 w-12 items-center justify-center rounded-[16px] bg-white/10">
                      <div class="sii-orbit inset-1"></div>
                      <span class="text-[21px] font-bold tracking-[-0.04em] text-white">SII</span>
                    </div>
                    <div>
                      <p class="text-label-caps text-[#c8d3f4]">Sincronización en curso</p>
                      <h3 class="mt-1 text-body-md font-semibold text-white">Documentos de compra · ${batch.periodo}</h3>
                    </div>
                  </div>
                  <span class="rounded-full bg-white/10 px-3 py-1 text-body-sm" id="sii-sync-status">Conectando</span>
                </div>

                <div class="mt-4 rounded-[20px] bg-[#0e1930] px-4 py-4">
                  <div class="flex items-center justify-between gap-3 text-body-sm text-[#d5def9]">
                    <span id="sii-sync-stage">Autenticando RUT ${batch.rut}</span>
                    <span id="sii-sync-stage-count">0/${totalDocs}</span>
                  </div>
                  <div class="mt-3 h-2.5 overflow-hidden rounded-full bg-white/10">
                    <div class="h-full rounded-full bg-[linear-gradient(90deg,_#ffb72b,_#7fb3ff,_#ffffff)] transition-all duration-500" id="sii-sync-progress" style="width:8%"></div>
                  </div>
                  <div class="mt-4 grid gap-2 sm:grid-cols-3">
                    <div class="rounded-2xl bg-white/6 px-3 py-3">
                      <p class="text-label-caps text-[#c8d3f4]">Facturas</p>
                      <p class="mt-1 font-data-md text-white"><span id="sii-sync-doc-count">0</span>/${totalDocs}</p>
                    </div>
                    <div class="rounded-2xl bg-white/6 px-3 py-3">
                      <p class="text-label-caps text-[#c8d3f4]">Monto importado</p>
                      <p class="mt-1 font-data-md text-white" id="sii-sync-amount">${insumosApi.formatCurrency(0)}</p>
                    </div>
                    <div class="rounded-2xl bg-white/6 px-3 py-3">
                      <p class="text-label-caps text-[#c8d3f4]">Destino</p>
                      <p class="mt-1 text-body-sm font-semibold text-white">Recepción de inventario</p>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <section class="rounded-[24px] border border-outline-variant bg-white p-4">
              <div class="flex items-center justify-between gap-3">
                <div>
                  <p class="text-label-caps text-on-surface-variant">Cola de importación</p>
                  <p class="mt-1 text-body-md font-semibold text-primary">${batch.empresa} · ${batch.sucursal}</p>
                </div>
                <span class="rounded-full bg-[#fff7e6] px-3 py-1 text-body-sm font-semibold text-[#7c5200]">${totalLines} líneas detectadas</span>
              </div>
              <div class="mt-4 space-y-2" id="sii-sync-feed">
                ${importDocuments.map((document) => `
                  <article class="rounded-[18px] border border-outline-variant bg-surface-container-low px-3 py-3 transition-all" id="sii-sync-doc-${document.index}">
                    <div class="flex items-center justify-between gap-3">
                      <div>
                        <p class="text-body-sm font-semibold text-primary">${document.proveedor}</p>
                        <p class="mt-1 text-body-sm text-on-surface-variant">${document.documento} · ${document.fecha}</p>
                      </div>
                      <div class="text-right">
                        <p class="font-data-md text-primary">${insumosApi.formatCurrency(document.total)}</p>
                        <p class="mt-1 text-[11px] text-[#7a86a4]" id="sii-sync-doc-state-${document.index}">En espera</p>
                      </div>
                    </div>
                  </article>
                `).join("")}
              </div>
            </section>
          </div>
        `,
        actions: [
          { id: "sii-cancel", label: "Cancelar sincronización" },
        ],
      });

      const progressEl = document.getElementById("sii-sync-progress");
      const statusEl = document.getElementById("sii-sync-status");
      const stageEl = document.getElementById("sii-sync-stage");
      const stageCountEl = document.getElementById("sii-sync-stage-count");
      const docCountEl = document.getElementById("sii-sync-doc-count");
      const amountEl = document.getElementById("sii-sync-amount");

      const finishSync = () => {
        if (syncFinished) {
          return;
        }
        syncFinished = true;
        clearSiiSyncTimers();
        insumosApi.closeModal();
        insumosApi.showToast("Sincronización SII lista. Las compras quedaron pendientes de recepción física.", "success");
        purchasePage = 0;
        renderInsumos();
      };

      document.getElementById("sii-cancel").addEventListener("click", () => {
        clearSiiSyncTimers();
        insumosApi.closeModal();
      });

      if (statusEl) statusEl.textContent = "Autenticando";
      if (stageEl) stageEl.textContent = `Autenticando RUT ${batch.rut}`;
      if (stageCountEl) stageCountEl.textContent = `0/${totalDocs}`;
      if (progressEl) progressEl.style.width = "12%";

      siiSyncTimers.push(window.setTimeout(() => {
        if (statusEl) statusEl.textContent = "Leyendo documentos";
        if (stageEl) stageEl.textContent = "Consultando DTE recibidos del periodo";
        if (progressEl) progressEl.style.width = "28%";
      }, 500));

      importDocuments.forEach((document, index) => {
        siiSyncTimers.push(window.setTimeout(() => {
          document.items.forEach((item) => {
            insumosApi.registrarCompraInsumo({
              proveedor: document.proveedor,
              insumoId: item.insumoId,
              cantidad: item.cantidad,
              precioUnitario: item.precioUnitario,
              fecha: document.fecha,
              documento: document.documento,
              origen: "SII",
            });
          });

          importedDocs += 1;
          importedAmount += document.total;

          const progressPct = Math.min(96, 28 + Math.round((importedDocs / Math.max(1, totalDocs)) * 62));
          const row = document.getElementById(`sii-sync-doc-${document.index}`);

        return;
      }

      function syncPurchasePreview() {
        const ingredient = ingredientMap[ingredientSelect.value];
        if (!ingredient) {
          return;
        }

        const quantity = Number(quantityInput.value || 0);
        const unitPrice = Number(priceInput.value || 0);
        const projectedStock = ingredient.stock + quantity;
        const projectedCapacity = Math.round((projectedStock / Math.max(1, ingredient.capacidad)) * 100);
        const shortageAfterPurchase = Math.max(0, ingredient.minimo - projectedStock);

        referenceTarget.textContent = insumosApi.formatCurrency(ingredient.precioReferencia);
        totalTarget.textContent = insumosApi.formatCurrency(quantity * unitPrice);
        stockTarget.textContent = `${projectedStock.toFixed(1)} ${ingredient.unidad}`;
        capacityTarget.textContent = `${Math.max(0, projectedCapacity)}%`;

        if (projectedStock > ingredient.capacidad) {
          messageTarget.textContent = "La compra quedará pendiente y conviene fraccionarla al momento de recibir.";
          return;
        }

        if (shortageAfterPurchase > 0) {
          messageTarget.textContent = `Si la recepción llega completa, aún faltarían ${shortageAfterPurchase.toFixed(1)} ${ingredient.unidad} para quedar sobre el mínimo.`;
          return;
        }

        if (projectedCapacity < 50) {
          messageTarget.textContent = "La recepción mejorará el stock, pero seguirá con cobertura ajustada.";
          return;
        }

        messageTarget.textContent = "Si la recepción queda conforme, el insumo quedará operativo para producción inmediata.";
      }

      if (!priceInput.value) {
        priceInput.value = state.insumos[0].precioReferencia;
      }
      syncPurchasePreview();

      ingredientSelect.addEventListener("change", () => {
        const nextIngredient = ingredientMap[ingredientSelect.value];
        priceInput.value = nextIngredient ? nextIngredient.precioReferencia : "";
        syncPurchasePreview();
      });
      quantityInput.addEventListener("input", syncPurchasePreview);
      priceInput.addEventListener("input", syncPurchasePreview);

      document.querySelectorAll(".reception-conforme").forEach((button) => {
        button.addEventListener("click", (event) => {
          const receipt = state.recepcionesPendientes.find((item) => item.id === event.currentTarget.dataset.receipt);
          if (!receipt) {
            return;
          }
          insumosApi.registrarRecepcionInsumo({
            id: receipt.id,
            recepcionEstado: "Conforme",
            cantidadRecibida: receipt.cantidadSolicitada,
          });
          insumosApi.showToast("Recepción conforme registrada y stock actualizado.", "success");
          renderInsumos();
        });
      });

      document.querySelectorAll(".reception-difference").forEach((button) => {
        button.addEventListener("click", (event) => {
          const receipt = state.recepcionesPendientes.find((item) => item.id === event.currentTarget.dataset.receipt);
          if (!receipt) {
            return;
          }
          openReceptionDifferenceModal(receipt, ingredientMap);
        });
      });

      document.getElementById("purchase-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const cantidad = Number(document.getElementById("purchase-quantity").value || 0);
        const precioUnitario = Number(document.getElementById("purchase-price").value || 0);
        if (cantidad <= 0 || precioUnitario <= 0) {
          insumosApi.showToast("Ingresa cantidad y precio válidos antes de guardar.", "warn");
          return;
        }

        insumosApi.registrarCompraInsumo({
          proveedor: document.getElementById("purchase-supplier").value,
          insumoId: document.getElementById("purchase-ingredient").value,
          cantidad,
          precioUnitario,
          fecha: document.getElementById("purchase-date").value || today,
          documento: document.getElementById("purchase-doc").value.trim(),
        });
        insumosApi.showToast("Compra registrada. Falta validar la recepción física para subir stock.", "success");
        purchasePage = 0;
        renderInsumos();
      });
    }

    window.addEventListener("focus", renderInsumos);
    window.addEventListener("storage", renderInsumos);
    renderInsumos();
  </script>
</body>
</html>
