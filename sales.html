<body class="min-h-screen bg-[radial-gradient(circle_at_top_left,_rgba(255,222,173,0.24),_transparent_22%),radial-gradient(circle_at_top,_rgba(213,227,253,0.38),_transparent_28%),linear-gradient(180deg,_#fffaf2,_#f5efe4_52%,_#eef2f6)] text-on-surface antialiased md:flex">

  <main class="min-w-0 flex-1">
    <header class="sticky top-0 z-30 border-b border-outline-variant/80 bg-[rgba(247,249,251,0.82)] px-4 py-4 backdrop-blur-xl sm:px-6 md:min-h-[88px] md:px-container-padding" id="topbar"></header>
    <div class="mx-auto w-full max-w-none space-y-stack-lg px-4 pb-6 pt-6 sm:px-6 md:p-container-padding md:pt-8" id="sales-root"></div>
  </main>
  <script src="state.js?v=20260709-ui6"></script>
  <script>
    const salesApi = window.LanzaroteState;
    const salesParams = new URLSearchParams(window.location.search);
    const salesFocus = salesParams.get("focus") || "";
    let activeChannelId = salesParams.get("channel") || (salesFocus === "collections" ? "retiro" : "meson");
    let selectedCustomerId = "aromos";
    let selectedPaymentStatus = "Pendiente";

    function renderSales() {
      const state = salesApi.getState();
      const metrics = salesApi.buildMetrics(state);
      const productMap = salesApi.getProductMap(state);
      const customerMap = salesApi.getCustomerMap(state);
      const activeChannel = state.canales.find((item) => item.id === activeChannelId) || state.canales[0];
      activeChannelId = activeChannel.id;
      const availableProducts = activeChannel.stock.filter((item) => item.cantidad > 0);
      const selectedProductId = availableProducts[0] ? availableProducts[0].productoId : "";
      const selectedProduct = productMap[selectedProductId];
      const selectedCustomer = customerMap[selectedCustomerId] || state.clientesComerciales[0];
      selectedCustomerId = selectedCustomer ? selectedCustomer.id : "";
      const delta = salesApi.calcularDelta(metrics.expectedCollections || 1, metrics.realCollections || 0);
      const shouldWarn = activeChannelId === "retiro" && selectedCustomer && selectedCustomer.saldo > 0 && selectedCustomer.diasVencimiento >= 30;
      const channelSummary = state.canales.map((channel) => {
        const sales = metrics.soldByChannel[channel.id] || { units: 0, revenue: 0 };
        return {
          id: channel.id,
          label: channel.nombre,
          units: sales.units,
          revenue: sales.revenue,
        };
      });
      const maxChannelUnits = Math.max(1, ...channelSummary.map((item) => item.units));
      const mixRows = metrics.productMix.slice(0, 6);
      const topMixShare = Math.max(1, ...mixRows.map((item) => item.sharePct || 0));
      const mixPalette = ["#ffb72b", "#2f57d3", "#39b980", "#ff7a66", "#8b6ef2", "#6d4627"];
      const mixChartRows = mixRows.map((item, index) => ({
        ...item,
        color: mixPalette[index % mixPalette.length],
      }));
      const mixChartGradient = (() => {
        if (!mixChartRows.length) {
          return "conic-gradient(#e8eeff 0deg 360deg)";
        }
        let cursor = 0;
        return `conic-gradient(${mixChartRows.map((item) => {
          const start = cursor;
          cursor += Math.max(0, Number(item.sharePct || 0)) * 3.6;
          return `${item.color} ${start}deg ${cursor}deg`;
        }).join(", ")})`;
      })();
      const collectionProgress = Math.max(8, Math.min(100, Math.round(((metrics.realCollections || 0) / Math.max(1, metrics.expectedCollections || 1)) * 100)));
      const averageTicket = state.ventas.length ? Math.round(state.ventas.reduce((sum, sale) => sum + sale.monto, 0) / state.ventas.length) : 0;
      const topChannel = [...channelSummary].sort((a, b) => b.revenue - a.revenue)[0] || { label: "Sin canal", revenue: 0, units: 0 };
      const activeChannelUnits = activeChannel.stock.reduce((sum, item) => sum + item.cantidad, 0);
      const selectedCustomerStatus = selectedCustomer ? salesApi.getCustomerStatus(selectedCustomer) : null;
      const productUnitPrice = selectedProduct ? selectedProduct.precioUnitario : 0;

      salesApi.mountShell({
        activePage: "sales",
        title: "Ventas",
        header: {
          eyebrow: "VENTAS Y COBRANZAS",
          badge: metrics.formattedSoldAmount,
          badgeIcon: "payments",
          secondaryActions: [
            { id: "sales-refresh", icon: "autorenew", label: "Refrescar" },
            { id: "sales-distribution", icon: "local_shipping", label: "Distribución" },
          ],
          primaryAction: { id: "sales-dashboard", icon: "dashboard", label: "Dashboard" },
        },
      });

      const root = document.getElementById("sales-root");
      root.innerHTML = `
        ${!salesFocus ? `
          <section class="grid gap-4 xl:grid-cols-[minmax(0,1.15fr)_340px]">
            <article class="rounded-[32px] border border-[#ead7b2] bg-[radial-gradient(circle_at_top_left,_rgba(255,222,173,0.3),_transparent_24%),linear-gradient(180deg,_#fffdfa,_#fff5e6)] p-6 shadow-[0_18px_36px_rgba(140,96,31,0.1)] md:p-7">
              <div class="flex flex-wrap items-center gap-2">
                <span class="inline-flex items-center gap-2 rounded-full border border-[#ffd489] bg-[#fff5df] px-3 py-1 text-body-sm font-medium text-[#b46b00]">
                  <span class="material-symbols-outlined text-[18px]">storefront</span>
                  Frente comercial
                </span>
                <span class="rounded-full bg-white px-3 py-1 text-body-sm text-[#8f775c] shadow-soft">Panadator</span>
              </div>
              <h1 class="mt-4 max-w-4xl text-[34px] font-bold leading-[1.02] tracking-[-0.05em] text-primary md:text-[48px]">Ventas, cobro y devoluciones en una sola vista.</h1>
              <p class="mt-3 max-w-3xl text-body-md text-[#6f624f]">Canal activo, caja y saldo comercial.</p>
              <div class="mt-6 grid gap-3 md:grid-cols-4">
                ${salesMetricCard("payments", "Venta total", metrics.formattedSoldAmount, `${metrics.totalSoldUnits} u`, "soft")}
                ${salesMetricCard("storefront", "Canal activo", activeChannel.nombre, `${availableProducts.length} productos`, "warm")}
                ${salesMetricCard("account_balance_wallet", "Cobranza", `${metrics.effectiveCollectionsPct}%`, salesApi.formatCurrency(metrics.realCollections), "default")}
                ${salesMetricCard("warning", "Vencido", salesApi.formatCurrency(metrics.overdueReceivables), shouldWarn ? "requiere atención" : "sin bloqueo", shouldWarn ? "alert" : "default")}
              </div>
            </article>

            <aside class="rounded-[30px] bg-[linear-gradient(180deg,_#6d4627,_#4f311c)] p-5 text-white shadow-[0_20px_40px_rgba(79,49,28,0.22)]">
              <p class="text-label-caps text-[#dbc7b3]">Pulso comercial</p>
              <div class="mt-4 space-y-3">
                ${channelSummary.map((item) => `
                  <div class="rounded-2xl bg-white/10 p-4">
                    <div class="flex items-center justify-between gap-3">
                      <span class="text-body-sm text-[#dbc7b3]">${item.label}</span>
                      <span class="font-data-md text-white">${item.units} u</span>
                    </div>
                    <p class="mt-2 text-body-md font-semibold text-white">${salesApi.formatCurrency(item.revenue)}</p>
                    <div class="mt-3 h-2 overflow-hidden rounded-full bg-white/10">
                      <div class="h-full ${item.id === "meson" ? "bg-[#39b980]" : item.id === "retiro" ? "bg-[#8aa3ff]" : "bg-[#f1b33f]"}" style="width:${Math.max(10, Math.round((item.units / maxChannelUnits) * 100))}%"></div>
                    </div>
                  </div>
                `).join("")}
              </div>
            </aside>
          </section>
        ` : ""}

        ${salesFocus === "channels" ? `
          <section class="rounded-xl border border-[#dce4ff] bg-[linear-gradient(180deg,_#f5f8ff,_#ffffff)] p-5 shadow-soft">
            <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
              <div>
                <p class="text-label-caps text-[#7181a3]">Detalle desde dashboard</p>
                <h2 class="mt-2 text-headline-md text-primary">Venta por canal</h2>
                <p class="mt-2 text-body-sm text-on-surface-variant">Volumen y monto comparado entre mesón, retiro y delivery.</p>
              </div>
              <a class="inline-flex items-center gap-2 rounded-full border border-[#dce4ff] bg-white px-4 py-2 text-body-sm font-semibold text-[#2341ae]" href="index.html">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                Volver al dashboard
              </a>
            </div>
            <div class="mt-4 grid gap-3 md:grid-cols-3">
              ${channelSummary.map((item) => `
                <button class="channel-switch rounded-[22px] border ${item.id === activeChannelId ? "border-[#2f57d3]/20 bg-white shadow-soft" : "border-outline-variant bg-white"} p-4 text-left transition-colors hover:border-[#dce4ff] hover:bg-[#f9fbff]" data-channel="${item.id}" type="button">
                  <div class="flex items-center justify-between gap-3">
                    <span class="text-body-md font-semibold text-primary">${item.label}</span>
                    <span class="font-data-md text-[#2341ae]">${item.units} u</span>
                  </div>
                  <p class="mt-2 text-body-sm text-on-surface-variant">${salesApi.formatCurrency(item.revenue)}</p>
                  <div class="mt-3 h-2.5 overflow-hidden rounded-full bg-[#e8eeff]">
                    <div class="h-full rounded-full ${item.id === "meson" ? "bg-[#39b980]" : item.id === "retiro" ? "bg-[#2f57d3]" : "bg-[#ffb72b]"}" style="width:${Math.max(8, Math.round((item.units / maxChannelUnits) * 100))}%"></div>
                  </div>
                </button>
              `).join("")}
            </div>
          </section>
        ` : ""}

        ${salesFocus === "mix" ? `
          <section class="rounded-xl border border-[#ffe0a0] bg-[linear-gradient(180deg,_#fff8ea,_#ffffff)] p-5 shadow-soft">
            <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
              <div>
                <p class="text-label-caps text-[#9c6400]">Detalle desde dashboard</p>
                <h2 class="mt-2 text-headline-md text-primary">Mix de producto</h2>
                <p class="mt-2 text-body-sm text-on-surface-variant">Participación de cada tipo de pan dentro de la venta total.</p>
              </div>
              <a class="inline-flex items-center gap-2 rounded-full border border-[#ffe0a0] bg-white px-4 py-2 text-body-sm font-semibold text-[#7a4f00]" href="index.html">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                Volver al dashboard
              </a>
            </div>
            <div class="mt-4 grid gap-3 xl:grid-cols-[minmax(0,1.1fr)_320px]">
              <div class="rounded-[24px] border border-outline-variant bg-white p-5 shadow-soft">
                <div class="grid gap-5 lg:grid-cols-[260px_minmax(0,1fr)] lg:items-center">
                  <div class="flex flex-col items-center justify-center">
                    <div class="relative h-[220px] w-[220px] rounded-full shadow-[0_18px_36px_rgba(140,96,31,0.14)]" style="background:${mixChartGradient}">
                      <div class="absolute left-1/2 top-1/2 flex h-[112px] w-[112px] -translate-x-1/2 -translate-y-1/2 flex-col items-center justify-center rounded-full border border-[#fff3db] bg-white text-center shadow-[0_10px_24px_rgba(47,87,211,0.08)]">
                        <p class="text-label-caps text-[#9c6400]">Líder</p>
                        <p class="mt-2 text-body-md font-semibold text-primary">${mixChartRows[0]?.producto || "Sin mix"}</p>
                        <p class="mt-1 font-data-md text-[#7a4f00]">${mixChartRows[0]?.sharePct || 0}%</p>
                      </div>
                    </div>
                    <p class="mt-4 text-body-sm text-on-surface-variant">Participación sobre venta total.</p>
                  </div>
                  <div class="space-y-3">
                    ${mixChartRows.map((item) => `
                      <article class="rounded-[22px] border border-outline-variant bg-white p-4 shadow-soft">
                        <div class="flex items-center justify-between gap-3">
                          <div class="flex min-w-0 items-start gap-3">
                            <span class="mt-1 h-3.5 w-3.5 shrink-0 rounded-full" style="background:${item.color}"></span>
                            <div class="min-w-0">
                              <p class="text-body-md font-semibold text-primary">${item.producto}</p>
                              <p class="mt-1 text-body-sm text-on-surface-variant">${item.units} unidades · ${salesApi.formatCurrency(item.revenue)}</p>
                            </div>
                          </div>
                          <span class="font-data-md text-[#7a4f00]">${item.sharePct}%</span>
                        </div>
                        <div class="mt-3 h-2.5 overflow-hidden rounded-full bg-[#f2e6c9]">
                          <div class="h-full rounded-full" style="width:${Math.max(8, Math.round((item.sharePct / topMixShare) * 100))}%; background:${item.color}"></div>
                        </div>
                      </article>
                    `).join("") || '<p class="rounded-xl bg-white p-4 text-body-md text-on-surface-variant">Sin ventas para calcular mix.</p>'}
                  </div>
                </div>
              </div>
              <aside class="rounded-[22px] border border-outline-variant bg-white p-4 shadow-soft">
                <p class="text-label-caps text-on-surface-variant">Lectura rápida</p>
                <div class="mt-4 space-y-3">
                  <div class="rounded-2xl bg-surface-container-low p-4">
                    <p class="text-label-caps text-on-surface-variant">Producto líder</p>
                    <p class="mt-2 text-body-md font-semibold text-primary">${mixChartRows[0]?.producto || "Sin líder"}</p>
                  </div>
                  <div class="rounded-2xl bg-surface-container-low p-4">
                    <p class="text-label-caps text-on-surface-variant">Participación</p>
                    <p class="mt-2 font-data-lg text-primary">${mixChartRows[0]?.sharePct || 0}%</p>
                  </div>
                  <div class="rounded-2xl bg-surface-container-low p-4">
                    <p class="text-label-caps text-on-surface-variant">Productos con venta</p>
                    <p class="mt-2 font-data-lg text-primary">${mixChartRows.length}</p>
                  </div>
                </div>
              </aside>
            </div>
          </section>
        ` : ""}

        ${salesFocus === "collections" ? `
          <section class="rounded-xl border border-[#dce4ff] bg-[linear-gradient(180deg,_#f5f8ff,_#ffffff)] p-5 shadow-soft">
            <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
              <div>
                <p class="text-label-caps text-[#7181a3]">Detalle desde dashboard</p>
                <h2 class="mt-2 text-headline-md text-primary">Cobranza efectiva</h2>
                <p class="mt-2 text-body-sm text-on-surface-variant">Monto cobrado versus esperado y estado por cliente comercial.</p>
              </div>
              <a class="inline-flex items-center gap-2 rounded-full border border-[#dce4ff] bg-white px-4 py-2 text-body-sm font-semibold text-[#2341ae]" href="index.html">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                Volver al dashboard
              </a>
            </div>
            <div class="mt-4 grid gap-3 xl:grid-cols-[minmax(0,1fr)_320px]">
              <div class="rounded-[22px] border border-outline-variant bg-white p-4 shadow-soft">
                <div class="grid gap-3 md:grid-cols-2">
                  <div class="rounded-2xl bg-surface-container-low p-4">
                    <p class="text-label-caps text-on-surface-variant">Cobrado</p>
                    <p class="mt-2 font-data-lg text-primary">${salesApi.formatCurrency(metrics.realCollections)}</p>
                  </div>
                  <div class="rounded-2xl bg-surface-container-low p-4">
                    <p class="text-label-caps text-on-surface-variant">Esperado</p>
                    <p class="mt-2 font-data-lg text-primary">${salesApi.formatCurrency(metrics.expectedCollections)}</p>
                  </div>
                </div>
                <div class="mt-4">
                  <div class="mb-2 flex items-center justify-between text-body-sm">
                    <span class="text-on-surface-variant">Cobranza efectiva</span>
                    <span class="font-semibold text-primary">${metrics.effectiveCollectionsPct}%</span>
                  </div>
                  <div class="delta-track">
                    <div class="delta-fill ${metrics.effectiveCollectionsPct >= 80 ? "bg-on-tertiary-container" : "bg-secondary"}" style="width:${collectionProgress}%"></div>
                  </div>
                </div>
                <div class="mt-4 space-y-3">
                  ${state.clientesComerciales.map((customer) => {
                    const status = salesApi.getCustomerStatus(customer);
                    return `
                      <article class="rounded-2xl bg-surface-container-low p-4">
                        <div class="flex items-start justify-between gap-3">
                          <div>
                            <p class="text-body-md font-semibold text-primary">${customer.nombre}</p>
                            <p class="mt-1 text-body-sm text-on-surface-variant">${customer.diasVencimiento ? `${customer.diasVencimiento} días` : "sin mora"}</p>
                          </div>
                          <span class="rounded-full px-3 py-1 text-body-sm font-semibold ${status.toneClass}">${status.label}</span>
                        </div>
                        <p class="mt-3 font-data-md text-primary">${salesApi.formatCurrency(customer.saldo)}</p>
                      </article>
                    `;
                  }).join("")}
                </div>
              </div>
              <aside class="rounded-[22px] border border-outline-variant bg-white p-4 shadow-soft">
                <p class="text-label-caps text-on-surface-variant">Lectura rápida</p>
                <div class="mt-4 space-y-3">
                  <div class="rounded-2xl bg-surface-container-low p-4">
                    <p class="text-label-caps text-on-surface-variant">Saldo total</p>
                    <p class="mt-2 font-data-lg text-primary">${salesApi.formatCurrency(metrics.totalReceivables)}</p>
                  </div>
                  <div class="rounded-2xl bg-surface-container-low p-4">
                    <p class="text-label-caps text-on-surface-variant">Vencido</p>
                    <p class="mt-2 font-data-lg text-primary">${salesApi.formatCurrency(metrics.overdueReceivables)}</p>
                  </div>
                  <div class="rounded-2xl bg-surface-container-low p-4">
                    <p class="text-label-caps text-on-surface-variant">Clientes con saldo</p>
                    <p class="mt-2 font-data-lg text-primary">${state.clientesComerciales.filter((item) => item.saldo > 0).length}</p>
                  </div>
                </div>
              </aside>
            </div>
          </section>
        ` : ""}

        ${shouldWarn ? `
          <section class="rounded-xl border border-error bg-error-container p-4 text-on-error-container shadow-soft">

      document.getElementById("sales-refresh").addEventListener("click", renderSales);

        window.location.href = "index.html";
      });

        button.addEventListener("click", (event) => {
          activeChannelId = event.currentTarget.dataset.channel;
          renderSales();
        });
      });

      const productSelect = document.getElementById("sale-product");
      const quantityInput = document.getElementById("sale-quantity");
      const paymentSelect = document.getElementById("sale-payment");
      const customerSelect = document.getElementById("sale-customer");
      const statusSelect = document.getElementById("sale-status");

      function updateTotal() {
        const product = productMap[productSelect.value];
        const quantity = Math.max(1, Number(quantityInput.value || 1));
        document.getElementById("sale-total").textContent = salesApi.formatCurrency(product ? product.precioUnitario * quantity : 0);
      }

      productSelect.addEventListener("change", updateTotal);
      quantityInput.addEventListener("input", updateTotal);
      if (customerSelect) {
        customerSelect.addEventListener("change", (event) => {
          selectedCustomerId = event.target.value;
          renderSales();
        });
      }
      if (statusSelect) {
        statusSelect.addEventListener("change", (event) => {
          selectedPaymentStatus = event.target.value;
        });
      }

      document.getElementById("sales-form").addEventListener("submit", (event) => {
        event.preventDefault();
        if (!productSelect.value) {
          return;
        }
        const quantity = Math.max(1, Math.floor(Number(quantityInput.value || 1)));
        const product = productMap[productSelect.value];
        const stockItem = activeChannel.stock.find((item) => item.productoId === productSelect.value);
        if (!stockItem || quantity > stockItem.cantidad) {
          salesApi.showToast("La cantidad supera el stock disponible para este canal.", "warn");
          return;
        }
        const submitPayload = {
          canalId: activeChannelId,
          productoId: productSelect.value,
          cantidad: quantity,
          medioPago: paymentSelect.value,
          monto: quantity * product.precioUnitario,
        };

        if (activeChannelId === "retiro") {
          submitPayload.clienteComercialId = customerSelect.value;
          submitPayload.estadoPago = statusSelect.value;
        }

        const commitSale = () => {
          salesApi.registrarVenta(submitPayload);
          salesApi.showToast(`Venta registrada por ${quantity} unidades de ${product.nombre}.`, "success");
          renderSales();
        };

        if (activeChannelId === "retiro") {
          const customer = customerMap[customerSelect.value];
          if (customer && customer.saldo > 0 && customer.diasVencimiento >= 30) {
            salesApi.openModal({
              kicker: "Autorización comercial",
              title: "Cliente con saldo vencido",
              body: `
                <div class="space-y-4">
                  <p class="text-body-md text-on-surface">Antes de confirmar la venta, revisa la advertencia de saldo vencido del cliente seleccionado.</p>
                  <div class="rounded-xl bg-error-container p-4 text-on-error-container">
                    <p class="font-semibold">${salesApi.escapeHtml(customer.nombre)}</p>
                    <p class="mt-2 text-body-sm">Saldo actual ${salesApi.formatCurrency(customer.saldo)} · ${customer.diasVencimiento} días de vencimiento.</p>
                  </div>
                </div>
              `,
              actions: [
                { id: "sale-cancel-modal", label: "Cancelar" },
                {
                  id: "sale-authorize-modal",
                  label: "Autorizar venta",
                  className: "rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-primary-container",
                },
              ],
            });
            document.getElementById("sale-cancel-modal").addEventListener("click", salesApi.closeModal);
            document.getElementById("sale-authorize-modal").addEventListener("click", () => {
              salesApi.closeModal();
              commitSale();
            });
            return;
          }
        }

        commitSale();
      });

      document.getElementById("return-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const quantity = Number(document.getElementById("return-quantity").value || 0);
        if (quantity <= 0) {
          salesApi.showToast("Ingresa una cantidad válida para la devolución.", "warn");
          return;
        }
        salesApi.registrarDevolucion({
          productoId: document.getElementById("return-product").value,
          cantidad: quantity,
          motivo: document.getElementById("return-reason").value.trim(),
        });
        salesApi.showToast("Devolución registrada.", "success");
        renderSales();
      });
    }

    function summaryCard(label, value, helper, tone = "default") {
      const toneClass = tone === "data"
        ? "border-secondary/10 bg-secondary-fixed/50"
        : tone === "soft"
          ? "border-[#ead7b2] bg-[#fff7ea]"
        : tone === "alert"
          ? "border-error/10 bg-error-container/30"
          : "border-outline-variant bg-white";
      return `
        <article class="rounded-[24px] border ${toneClass} p-5 shadow-soft">
          <p class="text-label-caps text-on-surface-variant">${label}</p>
          <p class="mt-3 font-data-lg text-primary">${value}</p>
          <p class="mt-2 text-body-sm text-on-surface-variant">${helper}</p>
        </article>
      `;
    }

    function salesMetricCard(icon, label, value, helper, tone = "default") {
      const toneClass = tone === "warm"
        ? "border-[#f3ddba] bg-[#fff4df]"
        : tone === "soft"
          ? "border-[#dce4ff] bg-[#f7f9ff]"
          : tone === "alert"
            ? "border-error/10 bg-error-container/35"
            : "border-outline-variant bg-white";
      const iconClass = tone === "warm"
        ? "bg-[#fff1d5] text-[#b46b00]"
        : tone === "alert"
          ? "bg-error-container text-on-error-container"
          : "bg-[#edf2ff] text-[#2f57d3]";
      return `
        <article class="rounded-[22px] border ${toneClass} px-4 py-3 shadow-soft">
          <div class="flex items-center gap-3">
            <span class="flex h-10 w-10 items-center justify-center rounded-2xl ${iconClass}">
              <span class="material-symbols-outlined text-[18px]">${icon}</span>
            </span>
            <div>
              <p class="text-label-caps text-on-surface-variant">${label}</p>
              <p class="mt-1 font-data-md text-primary">${value}</p>
            </div>
          </div>
          <p class="mt-2 text-body-sm text-on-surface-variant">${helper}</p>
        </article>
      `;
    }

    function headlineKpiCard(icon, label, value, helper, tone = "default") {
      const toneClass = tone === "warm"
        ? "border-[#f3ddba] bg-[#fff4df]"
        : tone === "soft"
          ? "border-[#dce4ff] bg-[#f7f9ff]"
          : tone === "alert"
            ? "border-error/10 bg-error-container/35"
            : tone === "data"
              ? "border-[#d9e6ff] bg-[#f4f8ff]"
              : "border-outline-variant bg-white";
      const iconClass = tone === "warm"
        ? "bg-[#fff1d5] text-[#b46b00]"
        : tone === "alert"
          ? "bg-error-container text-on-error-container"
          : "bg-[#edf2ff] text-[#2f57d3]";
      return `
        <article class="rounded-[26px] border ${toneClass} p-4 shadow-soft">
          <div class="flex items-start justify-between gap-3">
            <div>
              <p class="text-label-caps text-on-surface-variant">${label}</p>
              <p class="mt-3 font-data-lg text-primary">${value}</p>
              <p class="mt-2 text-body-sm text-on-surface-variant">${helper}</p>
            </div>
            <span class="flex h-11 w-11 items-center justify-center rounded-2xl ${iconClass}">
              <span class="material-symbols-outlined text-[18px]">${icon}</span>
            </span>
          </div>
        </article>
      `;
    }

    function quickInsightCard(icon, label, value, helper, tone = "warm") {
      const toneClass = tone === "alert-dark"
        ? "bg-[#8d3228] text-white"
        : "bg-white/10 text-white";
      const helperClass = tone === "alert-dark" ? "text-[#ffd7d2]" : "text-[#e7d2bf]";
      return `
        <article class="rounded-2xl ${toneClass} p-4">
          <div class="flex items-start gap-3">
            <span class="flex h-10 w-10 items-center justify-center rounded-2xl bg-white/10">
              <span class="material-symbols-outlined text-[18px]">${icon}</span>
            </span>
            <div class="min-w-0">
              <p class="text-label-caps ${helperClass}">${label}</p>
              <p class="mt-1 text-body-md font-semibold text-white">${value}</p>
              <p class="mt-2 text-body-sm ${helperClass}">${helper}</p>
            </div>
          </div>
        </article>
      `;
    }

    function miniStat(label, value, tone = "default") {
      const toneClass = tone === "soft"
        ? "bg-[#f5f8ff]"
        : tone === "alert"
          ? "bg-[#fff1ef]"
          : "bg-surface-container-low";
      return `
        <article class="rounded-2xl ${toneClass} p-4">
          <p class="text-label-caps text-on-surface-variant">${label}</p>
          <p class="mt-2 font-data-md text-primary">${value}</p>
        </article>
      `;
    }

    window.addEventListener("focus", renderSales);
    window.addEventListener("storage", renderSales);
    renderSales();
  </script>
</body>
</html>
